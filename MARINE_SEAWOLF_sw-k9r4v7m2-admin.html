function beginNight(){g.phase='night';g.actions={};g.task=null;reveal=false;showScene(g.day===1?'first_night':'nightStart',{},()=>nightStart())}

function nightStart(){g.queue=alive().filter(actionable).map(p=>p.id).sort((a,b)=>{const pa=who(a),pb=who(b);if(role(pa).ability==='attack'&&role(pb).ability==='attack')return (pa.role==='boss'?1:0)-(pb.role==='boss'?1:0);return 0});g.cursor=0;for(const p of alive().filter(x=>!x.human&&actionable(x)))setNightAction(p,cpuNight(p));g.queue=g.queue.filter(id=>who(id).human);if(g.day>1&&alive().some(p=>role(p).team==='wolf'))showScene('wolfBefore',{},()=>nextNight());else nextNight()}

function cpuNight(p){const a=role(p).ability,ts=targets(p,a);if(!ts.length)return null;const scores=cpuScores(p);if(a==='attack'){if(p.role==='boss'){const allies=ts.filter(t=>role(t).team==='wolf'),outs=ts.filter(t=>role(t).team!=='wolf');if(allies.length&&publicSuspicion(p.id)>2&&Math.random()<.25)return chooseCPU(p,allies,t=>publicSuspicion(t.id));return chooseCPU(p,outs,t=>cpuThreat(p,t))?.id??null}return chooseCPU(p,ts.filter(t=>role(t).team!=='wolf'),t=>cpuThreat(p,t))?.id??null}if(a==='guard')return chooseCPU(p,ts,t=>publicValue(t))?.id??null;if(a==='divine'){const unknown=ts.filter(t=>p.known[t.id]===undefined);return chooseCPU(p,unknown.length?unknown:ts,t=>scores[t.id])?.id??null}if(a==='revenge')return chooseCPU(p,ts,t=>scores[t.id])?.id??null;return null}
function decideAttack(){const as=Object.values(g.actions).filter(a=>a.ability==='attack'&&a.target!=null),boss=as.find(a=>who(a.actor).role==='boss');if(boss)return boss;if(!as.length)return null;const counts={};as.forEach(a=>counts[a.target]=(counts[a.target]||0)+1);const max=Math.max(...Object.values(counts)),ids=Object.keys(counts).filter(k=>counts[k]===max).map(Number),target=rand(ids);return rand(as.filter(a=>a.target===target))}
function resolveNight(){if(g.day===1){g.actions={};g.task=null;g.nightDeaths=[];g.phase='morning';addLog('noVictim','昨夜の犠牲者はいませんでした。');showScene('first_morning',{},()=>render());return}const acts=Object.values(g.actions),protectedIds=new Set(),dead=new Set();for(const a of acts)if(a.ability==='guard'&&a.target!=null){protectedIds.add(a.target);who(a.actor).previousGuard=a.target}else if(a.ability==='defend')protectedIds.add(a.actor);const attack=g.day===1&&!g.rules.settings.firstNightAttack?null:decideAttack();if(attack){g.privateLog.push(`${g.day}日目の最終襲撃：${name(attack.actor)} → ${name(attack.target)}`);if(!protectedIds.has(attack.target)){dead.add(attack.target);const r=role(who(attack.target));if(r.ability==='counter'&&!protectedIds.has(attack.actor))dead.add(attack.actor)}}for(const a of acts.filter(a=>a.ability==='divine'&&a.target!=null)){const actor=who(a.actor),target=who(a.target),r=role(actor);if(dead.has(actor.id)&&!r.afterDeath)continue;actor.known[target.id]=role(target).team==='wolf'?'wolf':'notWolf';g.privateLog.push(`${g.day}日目 ${actor.display}の占い：${target.display}=${actor.known[target.id]}`);if(role(target).divineDeath)dead.add(target.id)}if(g.lastExile!=null)for(const a of acts.filter(a=>a.ability==='info'))who(a.actor).known[g.lastExile]=role(who(g.lastExile)).team==='wolf'?'wolf':'notWolf';applyDeathChains(dead);g.nightDeaths=[...dead];for(const id of dead)who(id).alive=false;if(dead.size)addLog('nightDeath',[...dead].map(name).join('、'),{deaths:[...dead]});else addLog('noVictim','昨夜の犠牲者はいませんでした。');g.task=null;const morning=()=>{g.phase='morning';showScene('morning',{},()=>showScene(dead.size?'death':'noVictim',{name:[...dead].map(name).join('、')},()=>{checkWinner();render()}))};if(attack)showScene('wolfAfter',{},morning);else morning()}
function resolveNightAuto(){

function applyDeathChains(dead){let changed=true;while(changed){changed=false;for(const p of g.players){if(dead.has(p.id)){const r=role(p);if(r.ability==='revenge'&&p.revengeTarget!=null&&!dead.has(p.revengeTarget)){dead.add(p.revengeTarget);changed=true}}}const foxAlive=g.players.some(p=>p.role==='fox'&&p.alive&&!dead.has(p.id));if(!foxAlive)for(const p of g.players.filter(p=>p.role==='devotee'&&p.alive&&!dead.has(p.id)&&role(p).linkedDeath)){dead.add(p.id);changed=true}}}

function nextDay(){if(g.cursor>=g.queue.length){g.round++;if(g.round>=g.rules.settings.speeches){g.phase='vote';showScene('voteStart',{},()=>beginVote());return}g.cursor=0}const p=who(g.queue[g.cursor]);if(!p?.alive){g.cursor++;return nextDay()}if(p.human){g.task={type:'speech',actor:p.id};reveal=false;render();return}const text=cpuSpeech(p);g.cursor++;showSpeech(p.id,text,()=>nextDay())}
function publicSuspicion(id){return g.log.reduce((n,l)=>n+(l.type==='speech'&&l.target===id&&l.kind==='suspect'?1:0)+(l.type==='answer'&&l.answer===id&&!([1,6,8].includes(l.kind))?.5:0),0)}
function cpuScores(p){const scores=Object.fromEntries(g.players.map(x=>[x.id,0])),hard=g.rules.settings.level==='hard',easy=g.rules.settings.level==='easy',weight=hard?1.5:easy?.45:1,lastByActor={},seerClaims=[];for(const l of g.log){if(l.type==='speech'){if(l.kind==='suspect'&&l.target!=null)scores[l.target]+=.45*weight;if(l.kind==='villagerFact'&&l.target!=null)scores[l.target]-=.9*weight;if(l.kind==='trust'&&l.target!=null)scores[l.target]-=.3*weight;if(l.kind==='divine'){seerClaims.push(l.actor);if(l.target!=null)scores[l.target]+=(l.result==='wolf'?1.25:-.65)*weight;if(l.target!=null&&p.known[l.target]&&p.known[l.target]!==l.result)scores[l.actor]+=2.5*weight}}if(l.type!=='votes')continue;const counts={};for(const v of l.votes)counts[v.target]=(counts[v.target]||0)+1;for(const v of l.votes){scores[v.target]+=.1*weight;if(lastByActor[v.actor]!=null&&lastByActor[v.actor]!==v.target)scores[v.actor]+=.2*weight;lastByActor[v.actor]=v.target;if(p.known[v.target]==='wolf')scores[v.actor]-=.45*weight;if(p.known[v.target]==='notWolf')scores[v.actor]+=.25*weight}for(const v of l.votes)if(counts[v.target]>1)scores[v.actor]+=.04*(counts[v.target]-1)*weight}if(new Set(seerClaims).size>1)for(const id of new Set(seerClaims))scores[id]+=.35*weight;for(const [id,v] of Object.entries(p.known))scores[id]=v==='wolf'?20:-20;if(role(p).team==='wolf')for(const x of g.players.filter(x=>role(x).team==='wolf'))scores[x.id]-=10;if(role(p).ability==='mayor')for(const id of p.mayorVillagers)scores[id]=-20;scores[p.id]=-100;return scores}

function publicValue(t){let n=0;for(const l of g.log)if(l.type==='speech'&&l.actor===t.id){if(l.kind==='divine')n+=2.5;if(l.kind==='claim')n+=1}return n}

function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;for(const f of files){const n=enc.encode(f.name),b=f.bytes,crc=crc32(b),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const ch=new Uint8Array(46+n.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint32(16,crc,true);cv.setUint32(20,b.length,true);cv.setUint32(24,b.length,true);cv.setUint16(28,n.length,true);cv.setUint32(42,off,true);ch.set(n,46);central.push(ch);off+=h.length+b.length}const size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,off,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
async function act(a,v){if(a==='overlay-next')return closeOverlay(true);if(a==='overlay-close')return closeOverlay(false);if(a==='show-logs')return showLogs();switch(a){case'home':view='home';reveal=false;break;case'help':view='help';reveal=false;break;case'admin':if(!PUBLIC)view='admin';break;case'admin-tab':adminTab=v;break;case'shuffle':setup=shuffle(cfg.characters.filter(c=>c.enabled).map(c=>c.id)).slice(0,cfg.settings.n);break;case'start':start();return;case'reveal':reveal=true;if(g.phase==='roles'){render();showRoleReveal(who(humans()[g.cursor].id));return}break;case'role-next':reveal=false;g.cursor++;if(g.cursor>=humans().length)beginNight();break;case'night-start':nightStart();return;case'night-select':{const p=who(g.task.actor),target=v==='none'?null:+v;if(target!=null&&!targets(p).some(x=>x.id===target))throw Error('対象を確認してください。');setNightAction(p,target);g.cursor++;g.task=null;reveal=false;nextNight();return}case'morning-next':beginDay();return;case'day-next':nextDay();return;case'speech-submit':return submitSpeech(who(g.task.actor));case'mayor-speech':return;case'question-pick':g.task.type='question-pick';break;case'question-back':g.task.type='speech';break;case'question-start':beginQuestion(who(g.task.actor),g.rules.questions.find(q=>q.id===v));return;case'answer-select':{const p=who(g.task.actor),answer=['none','unknown'].includes(v)?v:+v;g.question.answers.push({actor:p.id,answer});g.question.cursor++;g.task=null;reveal=false;nextAnswer();return}case'question-done':{const p=who(g.question.asker);g.question=null;g.task=p.human?{type:'speech',actor:p.id}:null;break}case'vote-start':beginVote();return;case'vote-select':{const p=who(g.task.actor),id=+v;if(!alive().some(x=>x.id===id&&id!==p.id))throw Error('投票先を確認してください。');g.pendingVotes.push({actor:p.id,target:id});g.voteCursor++;g.task=null;reveal=false;nextVote();return}case'quit':g=null;view='home';break;case'restart':g=null;view='home';break;case'export-result':download(JSON.stringify(g,null,2),'SEA_WOLF_result.json','application/json');break;case'save':validate(cfg);localStorage.setItem('sea-wolf-config-v2',JSON.stringify(cfg));toast('保存しました。');break;case'export-master':download(exportDocument(false),'MARINE_SEAWOLF_sw-k9r4v7m2-admin.html','text/html');break;case'export-index':download(exportDocument(true),'index.html','text/html');break;case'export-package':download(zip(packageData()),'MARINE_TRICK_SEA_WOLF_PUBLIC.zip');break;case'export-json':download(JSON.stringify(cfg,null,2),'SEA_WOLF_settings.json','application/json');break;case'add-char':cfg.characters.push(charBase({id:'c'+Date.now(),name:'新キャラクター'}));break;case'add-role':cfg.roles.push(roleBase({id:'r'+Date.now(),name:'新役職',description:'',team:'village',ability:'none'}));break;case'add-question':cfg.questions.push({id:'q'+Date.now(),text:'新しい質問',kind:0,enabled:true});break;case'role-reveal-remove':cfg.roles.find(r=>r.id===v).revealImage='';break;case'image-remove':{const[k,id]=v.split(':');if(k==='scenes')cfg.scenes[id].image='';else cfg[k].find(x=>x.id===id).image='';break}case'move':{const[k,i0,d]=v.split(':'),i=+i0,j=i+(+d);if(j>=0&&j<cfg[k].length)[cfg[k][i],cfg[k][j]]=[cfg[k][j],cfg[k][i]];break}case'remove':{const[k,id]=v.split(':');cfg[k]=cfg[k].filter(x=>x.id!==id);break}}render()}
function submitObserverGuess(id){if(g.task?.type!=='observer-guess')return;(g.guesses??=[]).push({day:g.day,id});g.task=null;toast(`${g.day}日目の予想を記録しました。`);finishVote()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
  if(!['logs-expand','logs-collapse','background-remove'].includes(a))return;
  e.preventDefault();e.stopImmediatePropagation();
  if(a==='logs-expand'||a==='logs-collapse'){document.querySelectorAll('#overlay .log-day').forEach(d=>d.open=a==='logs-expand');return}
  cfg.appearance.backgroundImage='';applyBackground();render()
},true);
document.addEventListener('change',async e=>{
  const el=e.target;if(el.dataset.imageScope!=='appearance')return;
  e.stopImmediatePropagation();
  try{cfg.appearance[el.dataset.imageKey||'backgroundImage']=await loadImage(el.files[0]);applyBackground();render()}catch(err){toast(err.message)}
},true);
document.addEventListener('change',async e=>{
  const el=e.target;if(el.dataset.imageScope!=='roles')return;
  e.stopImmediatePropagation();
  try{const r=cfg.roles.find(x=>x.id===el.dataset.id);if(!r)throw Error('役職が見つかりません。');const key=el.dataset.imageKey||'image';r[key]=await loadImage(el.files[0]);render();toast('画像を登録しました。')}catch(err){toast(err.message)}
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
  if(a==='role-night-remove'){e.preventDefault();e.stopImmediatePropagation();const r=cfg.roles.find(x=>x.id===b.dataset.value);if(r)r.nightActionImage='';render();return}
  if(a==='reveal'&&g?.task?.type==='night'){e.preventDefault();e.stopImmediatePropagation();reveal=true;render();showNightRoleIntro(who(g.task.actor))}
},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="observer-guess"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{submitObserverGuess(+b.dataset.value)}catch(err){toast(err.message)}},true);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;try{await act(b.dataset.action,b.dataset.value)}catch(err){toast(err.message)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.prediction==null)return;e.stopImmediatePropagation();const max=effectiveWolfCount(g.rules),n=document.querySelectorAll('[data-prediction]:checked').length;if(n>max){el.checked=false;toast(`${max}人まで選べます。`)}const count=document.querySelector('#prediction-count');if(count)count.textContent=`選択中 ${document.querySelectorAll('[data-prediction]:checked').length}/${max}人`},true);
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='speech-kind'){updateSpeechFields();return}if(el.id==='import-json'){cfg=migrate(JSON.parse(await el.files[0].text()));validate(cfg);setup=[];render();return}if(el.dataset.imageScope){const scope=el.dataset.imageScope,id=el.dataset.id,data=await loadImage(el.files[0]);if(scope==='scenes')cfg.scenes[id].image=data;else cfg[scope].find(x=>x.id===id)[el.dataset.imageKey||'image']=data;render();return}if(el.dataset.slot!=null){setup[+el.dataset.slot]=el.value;return}if(el.dataset.scope){const scope=el.dataset.scope,key=el.dataset.key,obj=scope==='settings'||scope==='setup'?cfg.settings:scope==='scenes'?cfg.scenes[el.dataset.id]:cfg[scope].find(x=>x.id===el.dataset.id);obj[key]=el.type==='checkbox'?el.checked:el.type==='number'||key==='kind'?Number(el.value):el.value;if(scope==='setup'||scope==='settings'){syncSetup(cfg.settings);if(['n','players','roleSetup','playMode'].includes(key))render()}else if(scope==='roles'&&key==='manualCount'){obj.manualCount=Math.max(0,Math.floor(Number(obj.manualCount))||0);render()}}}catch(err){toast(err.message)}});
window.addEventListener('pagehide',()=>{reveal=false});document.addEventListener('visibilitychange',()=>{if(document.hidden)reveal=false});render();
</script>
