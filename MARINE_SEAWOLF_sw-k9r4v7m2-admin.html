<head>

  <style>:root{--ink:#123d50;--blue:#087f94;--deep:#15384e;--line:#c4e4e9;--pink:#f57f93;--bg:#eaf8fa;--gold:#f3b744;--third:#7953b7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:radial-gradient(circle at 90% 0,#ccecf1,transparent 45%),var(--bg)}header{padding:22px max(18px,calc((100vw - 1080px)/2));background:#fff;border-bottom:1px solid var(--line)}header small{letter-spacing:.2em;color:var(--blue);font-weight:700}h1{margin:0;font-size:clamp(24px,4vw,36px);letter-spacing:.04em}h2{margin:0 0 12px;font-size:clamp(21px,3vw,28px)}h3{margin:7px 0}.sub,.muted{color:#66838e}.muted{font-size:14px}nav,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}nav{margin-top:13px}main{max-width:1080px;margin:auto;padding:22px 16px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 24px #155b6b0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.player{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px}.dead{opacity:.48}.avatar,.player img,.icon{width:56px;height:56px;object-fit:contain;background:#e8f5f7;border-radius:13px}.avatar{display:grid;place-items:center;font-size:24px;font-weight:700}.icon.large{width:min(70vw,330px);height:min(55vh,330px);margin:auto}.badge{display:inline-block;padding:3px 11px;border-radius:20px;background:#dff3f4;font-size:13px}.badge.third{background:#ece5fa;color:#54328c}.phase{font-weight:800;letter-spacing:.12em;color:var(--blue)}button,.file-button{min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:#b42e50}button:disabled{opacity:.45;cursor:default}input,select,textarea{width:100%;max-width:100%;padding:10px;border:1px solid #a9cfd6;border-radius:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:90px}label{display:block;margin:9px 0;font-size:14px}input[type=checkbox]{width:auto;margin-right:7px}input[type=file]{font-size:13px}.handoff{text-align:center;padding:45px 18px}.secret{min-height:330px;display:grid;place-content:center;text-align:center;background:var(--deep);color:#fff}.secret .muted{color:#bdd6df}.role-image{width:100%;max-height:220px;object-fit:contain}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:15px 0}.notice{padding:12px;border-left:4px solid var(--pink);background:#fff4f6}.toolbar{position:sticky;bottom:8px;z-index:4;box-shadow:0 7px 28px #123d5033}.log-day{border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}.log-day>summary{padding:12px 14px;background:#f4fbfc;font-weight:800;cursor:pointer}.log-entry{display:grid;grid-template-columns:105px 1fr;gap:9px;padding:9px 12px;border-top:1px solid #edf5f6;font-size:14px}.log-label{font-weight:800;color:var(--blue)}.log-speech{display:flex;gap:9px;align-items:flex-start}.log-speech img,.log-speech .avatar{width:38px;height:38px;font-size:16px}.speech-pop{position:fixed;z-index:50;left:50%;bottom:22px;transform:translateX(-50%);width:min(94vw,620px);display:flex;gap:13px;align-items:center;padding:16px;background:#fff;border:2px solid var(--blue);border-radius:18px;box-shadow:0 18px 60px #123d5066;animation:pop .24s ease-out}.speech-pop img,.speech-pop .avatar{flex:0 0 auto}@keyframes pop{from{opacity:0;transform:translate(-50%,18px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}#overlay:empty{display:none}.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:#0e2e43e8;color:#fff;text-align:center}.overlay-card{width:min(94vw,720px);max-height:92vh;overflow:auto;padding:26px;border-radius:24px;background:#173f58}.overlay-card img{display:block;max-width:100%;max-height:52vh;object-fit:contain;margin:0 auto 16px}.overlay-card .avatar{margin:0 auto 16px;width:min(68vw,320px);height:min(50vh,320px);font-size:90px}.overlay-card button{margin-top:14px}.asset-preview{width:100%;height:150px;object-fit:contain;background:#eff8fa;border-radius:12px}.asset-card{border:1px solid var(--line);border-radius:15px;padding:13px}.team-village{color:var(--blue)}.team-wolf{color:#b42e50}.team-third{color:var(--third)}details>summary{cursor:pointer;font-weight:800;padding:10px 0}.toast{position:fixed;z-index:99;left:50%;bottom:20px;transform:translateX(-50%);max-width:90vw;padding:11px 20px;border-radius:12px;background:#102f43;color:#fff}@media(max-width:600px){header{padding:16px}main{padding:16px 12px 70px}.card{padding:16px}.grid{grid-template-columns:1fr}.target-grid{grid-template-columns:1fr 1fr}.log-entry{grid-template-columns:1fr}.toolbar{position:static}button{font-size:14px}}
</style>
  <style>
    .speech-layer{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;padding:22px;background:#102f4326}
    .speech-pop{position:static;transform:none;width:min(94vw,680px);display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;padding:18px;background:#fff;border:3px solid var(--blue);border-radius:20px;box-shadow:0 20px 70px #123d5080;animation:speechIn .24s ease-out}
    .speech-pop img,.speech-pop .avatar{width:68px;height:68px;flex:0 0 auto}
    .speech-body{min-width:0}.speech-body strong{display:block;font-size:18px}.speech-body p{margin:3px 0 0;font-size:17px}
    .speech-label{display:inline-block;margin-bottom:3px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.12em}
    @keyframes speechIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .speech-editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
    .log-tool{display:grid;gap:2px;text-align:center}.log-tool small{color:#66838e}
    .log-button{border:2px solid var(--blue);color:var(--blue);background:#effbfc}.speech-actions{margin-top:14px}
    .muted-light{color:#c8e0e7}.log-modal{text-align:left}.log-modal>h2,.log-modal>.muted-light,.log-modal>button{text-align:center}
    .prediction-button{border:2px solid var(--third);color:var(--third);background:#f5f0ff}.prediction-modal{text-align:left}.prediction-modal>h2,.prediction-modal>p{text-align:center}
    .prediction-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.prediction-person{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;padding:9px;border:1px solid #7293a2;border-radius:13px;background:#fff;color:var(--ink);cursor:pointer}.prediction-person img,.prediction-person .avatar{grid-row:1/3;width:46px;height:46px;font-size:18px}.prediction-person input{width:auto;margin:0}.prediction-result{margin-bottom:18px;padding:16px;border:2px solid var(--third);border-radius:16px;background:#f8f4ff}.prediction-result>strong{font-size:20px;color:var(--third)}
    .guess-person{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 9px;text-align:left}.guess-person img,.guess-person .avatar{grid-row:1/3;width:48px;height:48px;font-size:18px}.guess-person span{font-weight:800}.guess-person small{color:#7b5aae}.guess-person.guessed{border-color:var(--third);background:#f8f4ff}.prediction-clear{border-color:#20a473;background:#edfff8}.prediction-fail{border-color:#d55c76;background:#fff3f6}
    @media(max-width:600px){.speech-editor-head{display:block}.log-tool{margin-top:12px;text-align:left}.log-tool button{width:100%}.speech-pop{grid-template-columns:auto 1fr}.speech-pop>button{grid-column:1/-1;width:100%}.speech-pop img,.speech-pop .avatar{width:58px;height:58px}}
  </style>

<body>
  <header>
    <small>MARINE TRICK / SOCIAL DEDUCTION</small>
    <h1>SEA WOLF</h1>
    <div class="sub">海の仲間たちと、言葉を手がかりに。</div>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <div id="overlay"></div>
  <script id="embedded" type="application/json">null</script>
  <script>const PUBLIC=false;'use strict';
const $=s=>document.querySelector(s);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const QUESTIONS=['今いちばん怪しいと思う人は誰？','今いちばん信用している人は誰？','昨日の投票で気になった人は誰？','昨夜の襲撃で気になった人は誰？','今日追放するなら誰？','今の時点でシーウルフだと思う人は誰？','シーウルフではなさそうな人は誰？','昨日と比べて印象が悪くなった人は誰？','昨日と比べて印象が良くなった人は誰？','今いちばん発言に矛盾を感じる人は誰？','役職を持っていそうだと思う人は誰？'];
const ABILITIES={none:'能力なし',attack:'襲撃候補',divine:'占い',guard:'護衛',defend:'自動防御',counter:'反撃',revenge:'道連れ',info:'追放者の情報',third:'第三陣営固有能力'};
const TEAM={village:'村人陣営',wolf:'シーウルフ陣営',third:'第三陣営'};
const LOG_LABEL={start:'開始',composition:'役職構成',speech:'通常発言',question:'全体質問',answer:'質問への回答',votes:'投票結果',nightDeath:'夜の死亡',noVictim:'犠牲者なし',exile:'昼の追放',noExile:'追放者なし',system:'進行',end:'勝敗'};
const SCENE_DEFAULTS={
  nightStart:{group:'phases',label:'夜開始',text:'夜が来た…',image:''},
  wolfBefore:{group:'phases',label:'シーウルフ選択前',text:'誰を襲うか…',image:''},
  wolfAfter:{group:'phases',label:'シーウルフ行動後',text:'シーウルフが動き出した…！？',image:''},
  morning:{group:'phases',label:'朝開始',text:'朝が来た…',image:''},
  death:{group:'phases',label:'死亡者発表',text:'{name}が死んでいた…',image:''},
  noVictim:{group:'phases',label:'犠牲者なし',text:'昨夜の犠牲者はいなかった！',image:''},
  dayStart:{group:'phases',label:'昼開始',text:'昼の話し合いが始まった！',image:''},
  question:{group:'phases',label:'全体質問開始',text:'{name}がみんなに聞きたい！',image:''},
  voteStart:{group:'phases',label:'投票開始',text:'投票の時間だ…',image:''},
  exile:{group:'phases',label:'追放結果',text:'追放されるのは{name}だ！',image:''},
  noExile:{group:'phases',label:'追放者なし',text:'追放者は出なかった！',image:''},
  villageWin:{group:'results',label:'村人陣営勝利',text:'シーウルフを追い出した！ 村に平和が戻った！',image:''},
  wolfWin:{group:'results',label:'シーウルフ陣営勝利',text:'シーウルフの方が多くなってしまった…',image:''},
  thirdWin:{group:'results',label:'第三勢力・特殊勝利',text:'{name}が特殊上がりを達成した！',image:''},
  draw:{group:'results',label:'引き分け',text:'勝利条件を満たす陣営はいなかった…',image:''}
};
function roleBase(x){return Object.assign({category:'special',min:0,max:1,enabled:false,priority:50,afterDeath:false,timing:'hit',image:'',winCondition:'none',divineDeath:false,linkedDeath:false},x)}
function defaults(){return{
  version:2,
  settings:{playMode:'player',n:8,cpu:7,wolves:2,thirdSlots:1,level:'normal',speeches:1,questions:true,includeAsker:false,disclosure:'hidden',selfGuard:false,repeatGuard:false,bossRate:8,villageWin:'zero',requiredSurvivors:2,wolfWin:'parity',firstNightAttack:false,firstDayExile:false},
  characters:['ファマリン','マロン','ナイト','アンナ','ユウカ','ダイくん','シャル','ヒトミ','コッチ先生','ノーティ','ハーミー','ボッシュ','タケシ','イヴ','ウッフィ','ふうと'].map((name,i)=>({id:'c'+i,name,image:'',personality:['calm','bold','careful','suspicious'][i%4],age:i===13?'baby':i<8?'child':'adult',gender:i%2?'male':'female',firstPerson:i%2?'ぼく':'私',suffix:'',enabled:true})),
  roles:[
    roleBase({id:'villager',name:'村人',description:'発言・質問・投票を手がかりにシーウルフを探す。',team:'village',category:'basic',ability:'none',max:99,enabled:true}),
    roleBase({id:'wolf',name:'シーウルフ',description:'仲間と相談し、一晩に1人を襲撃する。',team:'wolf',category:'basic',ability:'attack',max:99,enabled:true,priority:20}),
    roleBase({id:'seer',name:'占い師',description:'初夜から毎夜1人を調べ、シーウルフか否かを知る。',team:'village',ability:'divine',min:1,max:1,enabled:true}),
    roleBase({id:'knight',name:'ナイト',description:'毎夜1人を襲撃から守る。',team:'village',ability:'guard',min:1,max:1,enabled:true,priority:10}),
    roleBase({id:'boss',name:'ボスシーウルフ',description:'襲撃の最終決定権を持ち、仲間も対象にできる。',team:'wolf',ability:'attack',enabled:true,priority:20}),
    roleBase({id:'shell',name:'シェルガード',description:'自分への夜襲撃を自動で防ぐ。',team:'village',ability:'defend',priority:10}),
    roleBase({id:'counter',name:'反撃役',description:'襲撃されると襲撃実行者へ反撃する。',team:'village',ability:'counter',priority:30}),
    roleBase({id:'revenge',name:'道連れ役',description:'死亡時に選んだ相手を道連れにする。',team:'village',ability:'revenge',priority:30,afterDeath:true,timing:'death'}),
    roleBase({id:'medium',name:'情報役',description:'前日の追放者がシーウルフか否かを知る。',team:'village',ability:'info'}),
    roleBase({id:'fox',name:'妖狐',description:'第三陣営。最後まで生存したまま村人またはシーウルフの決着を迎えると、勝利を横取りする。占われると死亡する。',team:'third',ability:'third',enabled:true,winCondition:'survive',divineDeath:true}),
    roleBase({id:'jester',name:'てるてる',description:'第三陣営。昼の投票で追放されると、その場で単独勝利する。',team:'third',ability:'third',enabled:true,winCondition:'exiled'}),
    roleBase({id:'devotee',name:'背徳者',description:'第三陣営。妖狐を知り、妖狐の特殊上がりで共に勝利する。妖狐が全滅すると後追いする。',team:'third',ability:'third',enabled:true,winCondition:'linkedFox',linkedDeath:true})
  ],
  questions:QUESTIONS.map((text,i)=>({id:'q'+i,text,kind:i,enabled:true})),
  scenes:clone(SCENE_DEFAULTS)
}}
function migrate(raw){const d=defaults();if(!raw||typeof raw!=='object')return d;const c=Object.assign(d,raw);c.settings=Object.assign(d.settings,raw.settings||{});c.scenes=Object.assign(d.scenes,raw.scenes||{});c.characters=(raw.characters||d.characters).map((x,i)=>Object.assign(d.characters[i]||{},x));const byId=Object.fromEntries((raw.roles||[]).map(r=>[r.id,r]));c.roles=d.roles.map(r=>Object.assign(r,byId[r.id]||{}));for(const r of raw.roles||[])if(!c.roles.some(x=>x.id===r.id))c.roles.push(roleBase(r));c.questions=raw.questions||d.questions;c.version=2;return c}
let cfg;try{cfg=migrate(JSON.parse($('#embedded').textContent)||(!PUBLIC&&JSON.parse(localStorage.getItem('sea-wolf-config-v2')))||null)}catch{cfg=defaults()}
let g=null,view='home',setup=[],reveal=false,adminTab='settings',overlay=null,afterOverlay=null;
const role=p=>g.rules.roles.find(r=>r.id===p.role),who=id=>g.players.find(p=>p.id===id),alive=()=>g.players.filter(p=>p.alive),name=id=>who(id)?.display||'該当なし';
const rand=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function btn(t,a,v='',cls=''){return `<button class="${cls}" data-action="${a}" data-value="${E(v)}">${E(t)}</button>`}
function options(es,v){return es.map(([x,t])=>`<option value="${E(x)}" ${String(x)===String(v)?'selected':''}>${E(t)}</option>`).join('')}
function input(label,key,v,type='text',scope='settings',id=''){return `<label>${E(label)}<input type="${type}" value="${E(v)}" data-scope="${scope}" data-id="${E(id)}" data-key="${E(key)}"></label>`}
function select(label,key,v,es,scope='settings',id=''){return `<label>${E(label)}<select data-scope="${scope}" data-id="${E(id)}" data-key="${E(key)}">${options(es,v)}</select></label>`}
function check(label,key,v,scope='settings',id=''){return `<label><input type="checkbox" ${v?'checked':''} data-scope="${scope}" data-id="${E(id)}" data-key="${E(key)}">${E(label)}</label>`}
function img(src,cls=''){return src?`<img class="${cls}" src="${E(src)}" alt="登録画像">`:''}
function avatar(c,cls=''){return c.image?img(c.image,'icon '+cls):`<span class="avatar ${cls}">${E(c.name.slice(0,1))}</span>`}
function toast(t){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3200)}
function addLog(type,text,extra={}){g.log.push({day:g.day,type,text,...extra})}
function teamName(t){return TEAM[t]||'第三陣営'}
function fillText(s,vars={}){return String(s||'').replaceAll('{name}',vars.name||'')}
function showScene(key,vars={},next=null,extra=''){const sc=g?.rules?.scenes?.[key]||cfg.scenes[key]||SCENE_DEFAULTS[key];overlay={type:'scene',key,title:fillText(sc.text,vars),image:sc.image,extra};afterOverlay=next;renderOverlay()}
function showSpeech(actor,text,next){overlay={type:'speech',actor,text};afterOverlay=next;renderOverlay()}
function showLogs(){overlay={type:'logs'};afterOverlay=null;renderOverlay()}
function showPrediction(){overlay={type:'prediction'};afterOverlay=null;renderOverlay()}
function closeOverlay(run=true){overlay=null;$('#overlay').innerHTML='';const fn=afterOverlay;afterOverlay=null;if(run&&fn)fn()}
function renderOverlay(){const host=$('#overlay');if(!overlay){host.innerHTML='';return}if(overlay.type==='speech'){const p=who(overlay.actor);host.innerHTML=`<div class="speech-layer"><div class="speech-pop">${avatar(p.char)}<div class="speech-body"><span class="speech-label">通常発言</span><strong>${E(p.display)}</strong><p>${E(overlay.text)}</p></div>${btn('次の進行へ','overlay-next','','primary')}</div></div>`;return}if(overlay.type==='logs'){host.innerHTML=`<div class="overlay"><div class="overlay-card log-modal"><h2>これまでのゲームログ</h2><p class="muted-light">閉じると、選択中の発言内容へそのまま戻ります。</p>${logHTML()}${btn('発言画面へ戻る','overlay-close','','primary')}</div></div>`;return}if(overlay.type==='prediction'){const selected=new Set(g.prediction||[]);host.innerHTML=`<div class="overlay"><div class="overlay-card prediction-modal"><h2>シーウルフ予想</h2><p>${g.rules.settings.wolves}人を選んでください。何度でも変更できます。</p><div class="prediction-grid">${g.players.map(p=>`<label class="prediction-person">${avatar(p.char)}<input type="checkbox" data-prediction="${p.id}" ${selected.has(p.id)?'checked':''}><span>${E(p.display)}</span></label>`).join('')}</div><p id="prediction-count">選択中 ${selected.size}/${g.rules.settings.wolves}人</p><div class="row">${btn('予想を保存','prediction-save','','primary')}${btn('閉じる','overlay-close')}</div></div></div>`;return}const visual=overlay.actor!=null?avatar(who(overlay.actor).char,'large'):overlay.image?img(overlay.image):'';host.innerHTML=`<div class="overlay"><div class="overlay-card">${visual}<h2>${E(overlay.title)}</h2>${overlay.extra||''}${btn('次へ','overlay-next','','primary')}</div></div>`}
function logHTML(){if(!g?.log.length)return'<p>まだ公開ログはありません。</p>';const days=[...new Set(g.log.map(x=>x.day))];return days.map(day=>`<details class="log-day" open><summary>${day}日目</summary>${g.log.filter(x=>x.day===day).map(l=>`<div class="log-entry"><span class="log-label">${E(LOG_LABEL[l.type]||l.type)}</span><div>${l.actor!=null?`<div class="log-speech">${avatar(who(l.actor).char)}<span>${E(l.text)}</span></div>`:E(l.text)}</div></div>`).join('')}</details>`).join('')}
function render(){const nav=$('#nav');nav.innerHTML=btn('ゲーム','home')+btn('ヘルプ','help')+(!PUBLIC?btn('MASTER管理','admin'):'');if(view==='admin')renderAdmin();else if(view==='help')renderHelp();else if(!g)renderHome();else renderGame();renderOverlay()}

function cpuThreat(p,t){let n=publicValue(t);for(const l of g.log){if(l.type==='speech'&&l.actor===t.id&&l.kind==='suspect'&&l.target!=null&&role(who(l.target)).team==='wolf')n+=1;if(l.type==='votes')for(const v of l.votes)if(v.actor===t.id&&role(who(v.target)).team==='wolf')n+=.6}return n}

function cpuSpeech(p){const known=Object.entries(p.known).filter(([id])=>who(+id)?.alive);let kind='suspect',target=null,result=null,text;if(role(p).ability==='divine'&&known.length){const k=known.find(x=>x[1]==='wolf')||known.at(-1);target=+k[0];result=k[1];kind='divine';text=`私は占い師。${name(target)}は${result==='wolf'?'シーウルフ':'シーウルフではない'}。`}else if(role(p).team==='wolf'&&g.day<=2&&!g.wolfBluffUsed&&Math.random()<(g.rules.settings.level==='hard'?.55:.3)){const candidates=alive().filter(x=>x.id!==p.id&&role(x).team!=='wolf');target=rand(candidates).id;result=Math.random()<.55?'wolf':'notWolf';kind='divine';g.wolfBluffUsed=p.id;text=`占い師です。${name(target)}は${result==='wolf'?'シーウルフだった':'シーウルフではなかった'}。`}else{target=cpuPick(p,0);if(typeof target==='number'){const previous=g.log.filter(l=>l.type==='votes').flatMap(l=>l.votes).filter(v=>v.actor===target),switched=previous.length>1&&new Set(previous.map(v=>v.target)).size>1,divined=g.log.filter(l=>l.type==='speech'&&l.kind==='divine'&&l.target===target&&l.result==='wolf').at(-1),accused=g.log.filter(l=>l.type==='speech'&&l.kind==='suspect'&&l.target===target).length;text=divined?`${name(target)}にシーウルフ判定が出ている。占い師が本物かも含めて確認したい。`:switched?`${name(target)}は以前と投票先が変わっている。理由を聞きたい。`:accused?`${name(target)}を疑う発言が出ているけど、便乗せず根拠を確かめたい。`:`${name(target)}の発言をもう少し聞いて判断したい。`}else{kind=target;text=target==='none'?'今の情報では、強く疑える人はいない。':'まだ決めつけられるだけの情報がない。'}}addLog('speech',p.display+'：'+text,{actor:p.id,kind,target:typeof target==='number'?target:null,result});return text}
function beginQuestion(p,q){if(p.questionUsed)return;p.questionUsed=true;g.question={asker:p.id,q:clone(q),queue:alive().filter(x=>g.rules.settings.includeAsker||x.id!==p.id).map(x=>x.id),cursor:0,answers:[]};addLog('question',p.display+'：'+q.text,{actor:p.id,qid:q.id});g.task=null;const sc=g.rules.scenes.question;overlay={type:'scene',key:'question',title:fillText(sc.text,{name:p.display}),actor:p.id};afterOverlay=()=>{overlay={type:'scene',key:'question-content',title:q.text,image:sc.image};afterOverlay=()=>nextAnswer();renderOverlay()};renderOverlay()}
function nextAnswer(){while(g.question.cursor<g.question.queue.length){const p=who(g.question.queue[g.question.cursor]);if(p.human){g.task={type:'answer',actor:p.id};reveal=false;render();return}g.question.answers.push({actor:p.id,answer:cpuPick(p,g.question.q.kind)});g.question.cursor++}for(const a of g.question.answers)addLog('answer',`${name(a.actor)} → ${a.answer==='none'?'該当なし':a.answer==='unknown'?'わからない':name(a.answer)}`,{...a,kind:g.question.q.kind});g.task={type:'question-result'};render()}
function beginVote(){g.voteQueue=alive().map(p=>p.id);g.voteCursor=0;g.pendingVotes=[];nextVote()}
function cpuVote(p){const s=cpuScores(p),ts=alive().filter(x=>x.id!==p.id);return chooseCPU(p,ts,t=>s[t.id]).id}
function nextVote(){while(g.voteCursor<g.voteQueue.length){const p=who(g.voteQueue[g.voteCursor]);if(p.human){g.task={type:'vote',actor:p.id};reveal=false;render();return}g.pendingVotes.push({actor:p.id,target:cpuVote(p)});g.voteCursor++}if(g.rules.settings.playMode==='observer'&&!(g.guesses||[]).some(x=>x.day===g.day)){g.task={type:'observer-guess'};render();return}finishVote()}
function finishVote(){const votes=clone(g.pendingVotes);addLog('votes',votes.map(v=>`${name(v.actor)} → ${name(v.target)}`).join(' / '),{votes});const counts={};votes.forEach(v=>counts[v.target]=(counts[v.target]||0)+1);const max=Math.max(...Object.values(counts)),tops=Object.keys(counts).filter(id=>counts[id]===max).map(Number);g.lastExile=null;if(g.day===1&&!g.rules.settings.firstDayExile){addLog('noExile','1日目は投票先のみ公開し、追放者なし。',{reason:'firstDay'});endDayWithScene('noExile',{})}else if(tops.length!==1){addLog('noExile','票が割れたため、追放者なし。',{reason:'tie'});endDayWithScene('noExile',{})}else{g.lastExile=tops[0];const p=who(g.lastExile);p.alive=false;addLog('exile',`${p.display}が追放されました。`,{target:p.id});if(role(p).winCondition==='exiled'){g.winner=`${p.display}（${role(p).name}）の特殊勝利`;g.winners=[p.id];g.phase='end';g.task=null;addLog('end',g.winner);showScene('thirdWin',{name:p.display},()=>render());return}const dead=new Set([p.id]);applyDeathChains(dead);for(const id of dead)who(id).alive=false;endDayWithScene('exile',{name:p.display})}}
function endDayWithScene(key,vars){g.task=null;showScene(key,vars,()=>{if(!checkWinner()){for(const p of alive())p.previousScores=cpuScores(p);g.day++;beginNight()}else render()})}
function checkWinner(){if(g.phase==='end')return true;const living=alive(),wolves=living.filter(p=>role(p).team==='wolf').length,villagers=living.filter(p=>role(p).team==='village').length;let base=null;if(wolves===0)base='village';else if(g.rules.settings.wolfWin==='parity'&&wolves>=villagers||g.rules.settings.wolfWin==='eliminate'&&villagers===0)base='wolf';if(!base)return false;const foxes=living.filter(p=>role(p).winCondition==='survive');if(foxes.length){const linked=living.filter(p=>role(p).winCondition==='linkedFox');g.winners=[...foxes,...linked].map(p=>p.id);g.winner=`${foxes.map(p=>p.display).join('、')}（妖狐陣営）の特殊勝利`;g.phase='end';addLog('end',g.winner);showScene('thirdWin',{name:foxes.map(p=>p.display).join('、')},()=>render());return true}g.winners=living.filter(p=>role(p).team===base).map(p=>p.id);g.winner=base==='village'?'村人陣営の勝利':'シーウルフ陣営の勝利';g.phase='end';addLog('end',g.winner);showScene(base==='village'?'villageWin':'wolfWin',{},()=>render());return true}

function download(data,filename,mime='application/octet-stream'){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime})),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function loadImage(file){if(!file?.type.startsWith('image/'))throw Error('画像を選んでください。');if(file.size>20*1024*1024)throw Error('画像は20MB以下にしてください。');const b=await createImageBitmap(file),ratio=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*ratio));c.height=Math.max(1,Math.round(b.height*ratio));c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/webp',.88)}

function imageExt(s){return s.startsWith('data:image/png')?'png':s.startsWith('data:image/jpeg')?'jpg':'webp'}function bytes(s){return Uint8Array.from(atob(s.split(',')[1]),c=>c.charCodeAt(0))}
function packageData(){const c=clone(cfg),files=[];for(const x of c.characters)if(x.image?.startsWith('data:')){const path=`assets/icons/${x.id}.${imageExt(x.image)}`;files.push({name:path,bytes:bytes(x.image)});x.image=path}for(const r of c.roles)if(r.image?.startsWith('data:')){const path=`assets/roles/${r.id}.${imageExt(r.image)}`;files.push({name:path,bytes:bytes(r.image)});r.image=path}for(const[k,sc]of Object.entries(c.scenes))if(sc.image?.startsWith('data:')){const path=`assets/${sc.group}/${k}.${imageExt(sc.image)}`;files.push({name:path,bytes:bytes(sc.image)});sc.image=path}const enc=new TextEncoder();files.push({name:'index.html',bytes:enc.encode(exportDocument(true,c))},{name:'assets/icons/README.txt',bytes:enc.encode('キャラクターアイコン')},{name:'assets/roles/README.txt',bytes:enc.encode('役職カード')},{name:'assets/phases/README.txt',bytes:enc.encode('フェーズ演出')},{name:'assets/results/README.txt',bytes:enc.encode('勝敗演出')});return files}
function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;for(const f of files){const n=enc.encode(f.name),b=f.bytes,crc=crc32(b),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const ch=new Uint8Array(46+n.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint32(16,crc,true);cv.setUint32(20,b.length,true);cv.setUint32(24,b.length,true);cv.setUint16(28,n.length,true);cv.setUint32(42,off,true);ch.set(n,46);central.push(ch);off+=h.length+b.length}const size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,off,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
async function act(a,v){if(a==='overlay-next')return closeOverlay(true);if(a==='overlay-close')return closeOverlay(false);if(a==='show-logs')return showLogs();switch(a){case'home':view='home';reveal=false;break;case'help':view='help';reveal=false;break;case'admin':if(!PUBLIC)view='admin';break;case'admin-tab':adminTab=v;break;case'shuffle':setup=shuffle(cfg.characters.filter(c=>c.enabled).map(c=>c.id)).slice(0,cfg.settings.n);break;case'start':start();return;case'reveal':reveal=true;break;case'role-next':reveal=false;g.cursor++;if(g.cursor>=humans().length)beginNight();break;case'night-start':nightStart();return;case'night-select':{const p=who(g.task.actor),target=v==='none'?null:+v;if(target!=null&&!targets(p).some(x=>x.id===target))throw Error('対象を確認してください。');setNightAction(p,target);g.cursor++;g.task=null;reveal=false;nextNight();return}case'morning-next':beginDay();return;case'day-next':nextDay();return;case'speech-submit':{const p=who(g.task.actor),mode=$('#speech-kind').value,extra=$('#speech-text').value.trim();let kind=mode,target=null,result=null,text='';if(mode==='general'){kind=$('#speech-general').value;text={unknown:'まだわからない。もう少し話を聞きたい。',none:'今は強く疑う人はいない。',innocent:'私はシーウルフではありません。',withhold:'役職はまだ伏せます。',free:''}[kind];if(kind==='free'&&!extra)throw Error('発言を入力してください。')}else if(mode==='claim'){const id=$('#speech-claim-role').value,r=g.rules.roles.find(x=>x.id===id);if(!r)throw Error('名乗る役職を選んでください。');text=`私は${r.name}です。`;target=p.id}else{if($('#speech-target').value==='')throw Error('話題にする人を選んでください。');target=+$('#speech-target').value;if(mode==='divine'){result=$('#speech-result').value;if(!result)throw Error('報告する結果を選んでください。');text=`占い師です。${name(target)}は${result==='wolf'?'シーウルフ':'シーウルフではありません'}。`}else text=mode==='suspect'?`${name(target)}が怪しいと思う。`:`${name(target)}を信用しています。`}const full=text+(extra?(text?' ':'')+extra:'');addLog('speech',p.display+'：'+full,{actor:p.id,kind,target,result});g.cursor++;g.task=null;reveal=false;showSpeech(p.id,full,()=>render());return}case'question-pick':g.task.type='question-pick';break;case'question-back':g.task.type='speech';break;case'question-start':beginQuestion(who(g.task.actor),g.rules.questions.find(q=>q.id===v));return;case'answer-select':{const p=who(g.task.actor),answer=['none','unknown'].includes(v)?v:+v;g.question.answers.push({actor:p.id,answer});g.question.cursor++;g.task=null;reveal=false;nextAnswer();return}case'question-done':{const p=who(g.question.asker);g.question=null;g.task=p.human?{type:'speech',actor:p.id}:null;break}case'vote-start':beginVote();return;case'vote-select':{const p=who(g.task.actor),id=+v;if(!alive().some(x=>x.id===id&&id!==p.id))throw Error('投票先を確認してください。');g.pendingVotes.push({actor:p.id,target:id});g.voteCursor++;g.task=null;reveal=false;nextVote();return}case'quit':g=null;view='home';break;case'restart':g=null;view='home';break;case'export-result':download(JSON.stringify(g,null,2),'SEA_WOLF_result.json','application/json');break;case'save':validate(cfg);localStorage.setItem('sea-wolf-config-v2',JSON.stringify(cfg));toast('保存しました。');break;case'export-master':download(exportDocument(false),'MARINE_SEAWOLF_sw-k9r4v7m2-admin.html','text/html');break;case'export-index':download(exportDocument(true),'index.html','text/html');break;case'export-package':download(zip(packageData()),'MARINE_TRICK_SEA_WOLF_PUBLIC.zip');break;case'export-json':download(JSON.stringify(cfg,null,2),'SEA_WOLF_settings.json','application/json');break;case'add-char':cfg.characters.push({id:'c'+Date.now(),name:'新キャラクター',image:'',personality:'calm',age:'adult',gender:'other',firstPerson:'私',suffix:'',enabled:true});break;case'add-role':cfg.roles.push(roleBase({id:'r'+Date.now(),name:'新役職',description:'',team:'village',ability:'none'}));break;case'add-question':cfg.questions.push({id:'q'+Date.now(),text:'新しい質問',kind:0,enabled:true});break;case'image-remove':{const[k,id]=v.split(':');if(k==='scenes')cfg.scenes[id].image='';else cfg[k].find(x=>x.id===id).image='';break}case'move':{const[k,i0,d]=v.split(':'),i=+i0,j=i+(+d);if(j>=0&&j<cfg[k].length)[cfg[k][i],cfg[k][j]]=[cfg[k][j],cfg[k][i]];break}case'remove':{const[k,id]=v.split(':');cfg[k]=cfg[k].filter(x=>x.id!==id);break}}render()}
function submitObserverGuess(id){if(g.task?.type!=='observer-guess')return;(g.guesses??=[]).push({day:g.day,id});g.task=null;toast(`${g.day}日目の予想を記録しました。`);finishVote()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="observer-guess"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{submitObserverGuess(+b.dataset.value)}catch(err){toast(err.message)}},true);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;try{await act(b.dataset.action,b.dataset.value)}catch(err){toast(err.message)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.prediction==null)return;e.stopImmediatePropagation();const max=g.rules.settings.wolves,n=document.querySelectorAll('[data-prediction]:checked').length;if(n>max){el.checked=false;toast(`${max}人まで選べます。`)}const count=document.querySelector('#prediction-count');if(count)count.textContent=`選択中 ${document.querySelectorAll('[data-prediction]:checked').length}/${max}人`},true);
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='speech-kind'){updateSpeechFields();return}if(el.id==='import-json'){cfg=migrate(JSON.parse(await el.files[0].text()));validate(cfg);setup=[];render();return}if(el.dataset.imageScope){const scope=el.dataset.imageScope,id=el.dataset.id,data=await loadImage(el.files[0]);if(scope==='scenes')cfg.scenes[id].image=data;else cfg[scope].find(x=>x.id===id).image=data;render();return}if(el.dataset.slot!=null){setup[+el.dataset.slot]=el.value;return}if(el.dataset.scope){const scope=el.dataset.scope,key=el.dataset.key,obj=scope==='settings'||scope==='setup'?cfg.settings:scope==='scenes'?cfg.scenes[el.dataset.id]:cfg[scope].find(x=>x.id===el.dataset.id);obj[key]=el.type==='checkbox'?el.checked:el.type==='number'||key==='kind'?Number(el.value):el.value;if(scope==='setup'){cfg.settings.n=Math.max(4,Math.min(24,Math.floor(cfg.settings.n)||4));cfg.settings.cpu=Math.max(0,Math.min(cfg.settings.n-1,Math.floor(cfg.settings.cpu)||0));render()}}}catch(err){toast(err.message)}});
window.addEventListener('pagehide',()=>{reveal=false});document.addEventListener('visibilitychange',()=>{if(document.hidden)reveal=false});render();
</script>
