<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE TRICK SEA WOLF</title><style>
:root{--ink:#123d50;--blue:#077c92;--line:#c4e4e9;--pink:#f57f93;--bg:#eaf8fa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.7 system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#cfedf1,transparent 50%),var(--bg)}header{padding:24px max(20px,calc((100vw - 1080px)/2));background:#fff;border-bottom:1px solid var(--line)}header small{letter-spacing:.22em;color:var(--blue)}h1{font-size:clamp(22px,4vw,34px);letter-spacing:.04em;margin:0}h2{font-size:23px;margin:0 0 14px}h3{margin:8px 0}main{max-width:1080px;padding:24px 16px 60px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 5px 20px #155b6b08}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.badge{display:inline-block;border-radius:20px;background:#dff3f4;padding:3px 12px;font-size:13px}button,.file-label{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.danger{color:#b83456}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:default}input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #a8cfd6;border-radius:10px;padding:10px;max-width:100%;width:100%}textarea{min-height:90px}label{display:block;font-size:14px;margin:10px 0}input[type=checkbox]{width:auto;margin-right:8px}input[type=file]{font-size:13px}nav{margin-top:14px}.muted{color:#65828e;font-size:14px}.player{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px}.player img,.avatar{width:55px;height:55px;object-fit:contain;background:#eaf6f8;border-radius:12px}.avatar{display:grid;place-items:center;font-size:24px}.dead{opacity:.5}.log{max-height:350px;overflow:auto}.log p{border-bottom:1px solid #edf4f5;padding:8px 0;margin:0;font-size:14px}.secret{background:#183b55;color:#fff;text-align:center;min-height:300px;display:grid;place-content:center}.secret img{max-width:240px;max-height:300px;object-fit:contain;margin:10px auto}.secret .muted{color:#bcd7e3}.secret button{color:var(--ink)}.handoff{text-align:center;padding:45px 20px}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}.notice{border-left:4px solid var(--pink);padding:12px;background:#fff3f6;margin:12px 0}.phase{color:var(--blue);font-weight:bold;letter-spacing:.13em}.role-image{width:100%;max-height:180px;object-fit:contain}.toolbar{position:sticky;bottom:10px;z-index:2;box-shadow:0 5px 25px #123d5020}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#123d50;color:#fff;padding:12px 24px;border-radius:12px;z-index:20;max-width:90%}@media(max-width:600px){.card{padding:17px}.grid{grid-template-columns:1fr}header{padding:18px}td,th{font-size:13px;padding:6px}.target-grid{grid-template-columns:1fr 1fr}button{font-size:14px}}
</style></head><body><header><small>MARINE TRICK / SOCIAL DEDUCTION</small><h1>SEA WOLF</h1><div class="muted">海の仲間たちと、言葉を手がかりに。</div><nav class="row" id="nav"></nav></header><main id="app"></main>
<script id="embedded" type="application/json">null</script><script>
'use strict';
const PUBLIC=false;
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), copy=o=>JSON.parse(JSON.stringify(o));
const QUESTIONS=['今いちばん怪しいと思う人は誰？','今いちばん信用している人は誰？','昨日の投票で気になった人は誰？','昨夜の襲撃で気になった人は誰？','今日追放するなら誰？','今の時点でシーウルフだと思う人は誰？','シーウルフではなさそうな人は誰？','昨日と比べて印象が悪くなった人は誰？','昨日と比べて印象が良くなった人は誰？','今いちばん発言に矛盾を感じる人は誰？','役職を持っていそうだと思う人は誰？'];
const ABILITIES={none:'能力なし',attack:'襲撃',divine:'占い',guard:'護衛',defend:'防御',counter:'反撃',revenge:'道連れ',info:'情報取得（前日の追放者の陣営）'};
const PERSONALITIES={calm:'温厚',careful:'慎重',bold:'強気',suspicious:'疑り深い'};
function defaults(){return{version:1,settings:{n:8,cpu:7,wolves:2,level:'normal',speeches:1,questions:true,includeAsker:false,disclosure:'hidden',selfGuard:false,repeatGuard:false,villageWin:'zero',requiredSurvivors:2,wolfWin:'parity',bossRate:8},characters:['ファマリン','マロン','ナイト','アンナ','ユウカ','ダイくん','シャル','ヒトミ','コッチ先生','ノーティ','ハーミー','ボッシュ','タケシ','イヴ','ウッフィ','ふうと'].map((name,i)=>({id:'c'+i,name,image:'',personality:['calm','bold','careful','suspicious'][i%4],age:i===13?'baby':i<8?'child':'adult',gender:i%2?'male':'female',firstPerson:i%2?'ぼく':'私',suffix:'',enabled:true})),roles:[
{id:'villager',name:'村人',description:'発言・質問・投票を手がかりにシーウルフを探す。',team:'village',category:'basic',ability:'none',min:0,max:99,enabled:true,priority:50,afterDeath:false,timing:'hit',image:''},
{id:'wolf',name:'シーウルフ',description:'仲間と協力して夜に襲撃する。',team:'wolf',category:'basic',ability:'attack',min:0,max:99,enabled:true,priority:20,afterDeath:false,timing:'hit',image:''},
{id:'seer',name:'占い師',description:'毎夜1人の所属陣営を調べる。',team:'village',category:'special',ability:'divine',min:1,max:1,enabled:true,priority:50,afterDeath:false,timing:'hit',image:''},
{id:'knight',name:'ナイト',description:'毎夜1人を襲撃から守る。',team:'village',category:'special',ability:'guard',min:1,max:1,enabled:true,priority:10,afterDeath:false,timing:'hit',image:''},
{id:'boss',name:'ボスシーウルフ',description:'仲間も襲撃できる。自分は選択できない。',team:'wolf',category:'special',ability:'attack',min:0,max:1,enabled:true,priority:20,afterDeath:false,timing:'hit',image:''},
{id:'shell',name:'シェルガード',description:'自分への夜襲撃を防ぐ。',team:'village',category:'special',ability:'defend',min:0,max:1,enabled:false,priority:10,afterDeath:false,timing:'hit',image:''},
{id:'counter',name:'反撃役',description:'防がれていない襲撃を受けると襲撃実行者へ反撃する。',team:'village',category:'special',ability:'counter',min:0,max:1,enabled:false,priority:30,afterDeath:false,timing:'hit',image:''},
{id:'revenge',name:'道連れ役',description:'死亡時に夜に選んだ相手を道連れにする。追放時も発動。',team:'village',category:'special',ability:'revenge',min:0,max:1,enabled:false,priority:30,afterDeath:true,timing:'death',image:''},
{id:'medium',name:'情報役',description:'前日の追放者の所属陣営を知る。',team:'village',category:'special',ability:'info',min:0,max:1,enabled:false,priority:50,afterDeath:false,timing:'hit',image:''}],questions:QUESTIONS.map((text,i)=>({id:'q'+i,text,kind:i,enabled:true}))};}
let cfg;try{cfg=JSON.parse($('#embedded').textContent)||(!PUBLIC&&JSON.parse(localStorage.getItem('sea-wolf-config-v1')))||defaults();}catch{cfg=defaults();}
let g=null, view='home', setupSelection=[], reveal=false, modal=null, adminTab='settings';
function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function role(p){return g.rules.roles.find(r=>r.id===p.role)}function alive(){return g.players.filter(p=>p.alive)}function name(id){return g?.players.find(p=>p.id===id)?.display||'該当なし'}function who(id){return g.players.find(p=>p.id===id)}
function btn(text,action,data='',cls=''){return `<button class="${cls}" data-action="${action}" data-value="${E(data)}">${E(text)}</button>`}function options(entries,value){return entries.map(([v,t])=>`<option value="${E(v)}" ${v===String(value)?'selected':''}>${E(t)}</option>`).join('')}
function select(label,key,value,entries,scope='settings',id=''){return `<label>${E(label)}<select data-scope="${scope}" data-id="${E(id)}" data-key="${key}">${options(entries,value)}</select></label>`}function input(label,key,value,type='text',scope='settings',id=''){return `<label>${E(label)}<input type="${type}" value="${E(value)}" data-scope="${scope}" data-id="${E(id)}" data-key="${key}" ${type==='number'?'min="0" max="99"':''}></label>`}function check(label,key,value,scope='settings',id=''){return `<label><input type="checkbox" ${value?'checked':''} data-scope="${scope}" data-id="${E(id)}" data-key="${key}">${E(label)}</label>`}
function image(src,cls=''){return src?`<img class="${cls}" src="${E(src)}" alt="登録画像">`:''}function avatar(c){return c.image?image(c.image):`<span class="avatar">${E(c.name.slice(0,1))}</span>`}
function toast(t){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3500)}
function log(type,text,extra={}){g.log.push({day:g.day,type,text,...extra});}
function render(){ $('#nav').innerHTML=btn('ゲーム','home')+btn('ヘルプ','help')+(!PUBLIC?btn('MASTER管理','admin'):'');if(modal){renderModal();return}if(view==='admin')renderAdmin();else if(view==='help')renderHelp();else if(!g)renderHome();else renderGame(); }
function renderHome(){const s=cfg.settings,cs=cfg.characters.filter(c=>c.enabled);while(setupSelection.length<s.n)setupSelection.push(cs[setupSelection.length]?.id||'');setupSelection=setupSelection.slice(0,s.n);$('#app').innerHTML=`<div class="card"><div class="phase">WELCOME TO THE SEA</div><h2>誰が、シーウルフ？</h2><p>仲間の発言を聞き、質問で考えを確かめ、海の平和を守ろう。</p><div class="grid">${input('参加人数（4〜24）','n',s.n,'number','setup')}${input('CPU人数','cpu',s.cpu,'number','setup')}${input('シーウルフ人数','wolves',s.wolves,'number','setup')}${select('CPU難易度','level',s.level,[['easy','かんたん'],['normal','ふつう'],['hard','むずかしい']],'setup')}</div><p class="muted">人間 ${s.n-s.cpu}人 / CPU ${s.cpu}人。端末を受け渡して遊べます。</p></div><div class="card"><h2>参加キャラクター</h2><p class="muted">同じキャラクターは選べません。上から人間プレイヤー、残りがCPUです。</p><div class="grid">${setupSelection.map((id,i)=>`<label>${i<s.n-s.cpu?(i+1)+'P':'CPU'}<select data-slot="${i}">${options(cs.map(c=>[c.id,c.name]),id)}</select></label>`).join('')}</div><div class="row">${btn('キャラクターをシャッフル','shuffle')}${btn('ゲームを始める','start','','primary')}</div></div><div class="card"><h3>今回のルール</h3>${rulesSummary(cfg)}<p class="muted">キャラクター画像・役職カードはMASTERから登録できます。</p></div>`;}
function rulesSummary(c){const s=c.settings;return `<div class="row"><span class="badge">シーウルフ ${s.wolves}匹</span><span class="badge">昼の発言 ${s.speeches}回</span><span class="badge">全体質問 ${s.questions?'1ゲーム1回':'OFF'}</span></div><p>村人：シーウルフが全滅${s.villageWin==='survivors'?'し、村人が'+s.requiredSurvivors+'人以上生存':''}すれば勝利。シーウルフ：${s.wolfWin==='parity'?'生存数が村人陣営以上になれば勝利':'村人陣営が全滅すれば勝利'}。</p><p>${s.villageWin==='survivors'?'シーウルフ全滅時に必要生存数を満たさなければ引き分け。 ':''}同票は追放なし。ナイトは自己護衛${s.selfGuard?'可':'不可'}、連続護衛${s.repeatGuard?'可':'不可'}。特殊役職構成は${{hidden:'非公開',count:'人数のみ公開',all:'全公開'}[s.disclosure]}。</p>`;}
function validate(c){const s=c.settings;if(!Number.isInteger(s.n)||s.n<4||s.n>24)throw Error('参加人数は4〜24人にしてください。');if(!Number.isInteger(s.cpu)||s.cpu<0||s.cpu>=s.n)throw Error('人間プレイヤーを1人以上にしてください。');if(!Number.isInteger(s.wolves)||s.wolves<1||s.wolves>=s.n/2)throw Error('シーウルフ人数は1以上、参加人数の半分未満にしてください。');if(c.characters.filter(x=>x.enabled).length<s.n)throw Error('参加人数以上のキャラクターを有効にしてください。');if(!Number.isInteger(s.speeches)||s.speeches<1||s.speeches>5)throw Error('昼の発言は1〜5回にしてください。');if(s.villageWin==='survivors'&&(!Number.isInteger(s.requiredSurvivors)||s.requiredSurvivors<1||s.requiredSurvivors>s.n-s.wolves))throw Error('村人の必要生存人数は1〜初期村人数にしてください。');if(s.bossRate<0||s.bossRate>100||!Number.isFinite(s.bossRate))throw Error('ボス発生率は0〜100%にしてください。');if(!['zero','survivors'].includes(s.villageWin)||!['parity','eliminate'].includes(s.wolfWin))throw Error('勝利条件を確認してください。');for(const item of [...c.characters,...c.roles])if(item.image&&!/^data:image\/(webp|png|jpeg);base64,/.test(item.image))throw Error('画像はMASTERから再登録してください。');if(['characters','roles','questions'].some(k=>new Set(c[k].map(x=>x.id)).size!==c[k].length))throw Error('IDが重複しています。');for(const r of c.roles){if(!Number.isFinite(r.priority)||r.priority<0)throw Error('処理優先度を確認してください。');if(r.ability==='attack'&&r.team!=='wolf')throw Error(r.name+'：襲撃能力はシーウルフ陣営に設定してください。');if(!ABILITIES[r.ability]||!['village','wolf'].includes(r.team))throw Error('役職の陣営・能力タイプを確認してください。');if(r.id==='boss'&&(r.min!==0||r.max>1))throw Error('ボスは最低0・最大1匹です。');if(r.min<0||r.max<r.min||!Number.isInteger(r.min)||!Number.isInteger(r.max))throw Error(r.name+'の最低・最大人数を確認してください。');if(['guard','defend'].includes(r.ability)&&r.priority>=20)throw Error(r.name+'：護衛・防御の優先度は20未満にしてください。');}for(const [id,team,ability] of [['villager','village','none'],['wolf','wolf','attack'],['boss','wolf','attack']]){const r=c.roles.find(r=>r.id===id);if(r&&(r.team!==team||r.ability!==ability||(id!=='boss'&&r.category!=='basic')||(id==='boss'&&r.category!=='special')))throw Error(r.name+'の基本陣営・能力は変更できません。');}if(!c.roles.some(r=>r.id==='villager')||!c.roles.some(r=>r.id==='wolf')||!c.roles.some(r=>r.id==='boss'))throw Error('基本役職が不足しています。');if(s.questions&&!c.questions.some(q=>q.enabled))throw Error('質問を1問以上有効にしてください。');}
function allocate(c){const s=c.settings,deck=[];for(const team of ['wolf','village']){const quota=team==='wolf'?s.wolves:s.n-s.wolves;const specs=c.roles.filter(r=>r.enabled&&r.category==='special'&&r.id!=='boss'&&r.team===team);const mandatory=specs.reduce((a,r)=>a+r.min,0);if(mandatory>quota)throw Error(team+'陣営の最低役職人数が多すぎます。');for(const r of specs)for(let i=0;i<r.min;i++)deck.push(r.id);let used=mandatory;const optional=shuffle(specs.flatMap(r=>Array(Math.min(r.max-r.min,quota)).fill(r.id)));for(const rid of optional){if(used>=quota)break;if(Math.random()<.35){deck.push(rid);used++;}}const base=c.roles.find(r=>r.id===(team==='wolf'?'wolf':'villager'));if(!base.enabled||quota-used>base.max)throw Error(base.name+'の最大人数・抽選設定を確認してください。');for(let i=used;i<quota;i++)deck.push(base.id);}
const boss=c.roles.find(r=>r.id==='boss');const ordinary=deck.map((r,i)=>r==='wolf'?i:-1).filter(i=>i>=0);if(s.wolves>=3&&boss.enabled&&boss.max>=1&&ordinary.length&&Math.random()<s.bossRate/100)deck[rand(ordinary)]='boss';return shuffle(deck);}
function start(){validate(cfg);if(new Set(setupSelection).size!==cfg.settings.n||setupSelection.some(id=>!cfg.characters.find(c=>c.id===id&&c.enabled)))throw Error('全員異なる有効なキャラクターを選んでください。');const deck=allocate(cfg);g={rules:copy(cfg),players:setupSelection.map((id,i)=>{const c=copy(cfg.characters.find(c=>c.id===id));return{id:i,char:c,display:c.name+(i<cfg.settings.n-cfg.settings.cpu?' '+(i+1)+'P':''),human:i<cfg.settings.n-cfg.settings.cpu,role:deck[i],alive:true,questionUsed:false,known:{},previousGuard:null,revengeTarget:null,previousScores:{}}}),day:1,phase:'roles',cursor:0,log:[],privateLog:[],actions:{},votes:[],lastExile:null,nightDeaths:[],task:null,round:0,question:null,winner:null};log('start',`ゲーム開始。シーウルフ陣営は${cfg.settings.wolves}匹。`);const sp=g.players.filter(p=>role(p).category==='special');if(cfg.settings.disclosure==='count')log('composition',`特殊役職は${sp.length}人。`);if(cfg.settings.disclosure==='all'){const counts={};sp.forEach(p=>counts[role(p).name]=(counts[role(p).name]||0)+1);log('composition','特殊役職：'+Object.entries(counts).map(([k,v])=>k+' '+v+'人').join('、'));}reveal=false;render();}
function humans(){return g.players.filter(p=>p.human)}
function handoff(p,content){return reveal?content:`<div class="card handoff"><div class="phase">PRIVATE TURN</div><h2>${E(p.display)}さんの番です</h2><p>端末を受け取り、周りの人に画面が見えないことを確認してください。</p>${btn('本人です・画面を開く','reveal','','primary')}</div>`;}
function secretCard(p){const r=role(p);return `<div class="card secret"><div class="phase">YOUR ROLE</div><h2>${E(r.name)}</h2>${image(r.image)}<p>${E(r.description)}</p><p>${r.team==='wolf'?'シーウルフ':'村人'}陣営</p>${r.ability==='guard'?`<p>自己護衛${g.rules.settings.selfGuard?'可':'不可'} / 連続護衛${g.rules.settings.repeatGuard?'可':'不可'}</p>`:''}${r.team==='wolf'?`<p>仲間：${g.players.filter(x=>x.id!==p.id&&role(x).team==='wolf').map(x=>E(x.display)+(x.alive?'':'（死亡）')+(x.role==='boss'?'［ボス］':'')).join('、')||'なし'}</p>`:''}<p class="muted">${Object.entries(p.known).map(([id,v])=>`${E(name(+id))}：${v==='wolf'?'シーウルフ':'村人'}陣営`).join('<br>')}</p></div>`;}
function renderGame(){if(g.phase==='roles'){const list=humans(),p=list[g.cursor];$('#app').innerHTML=handoff(p,secretCard(p)+`<div class="card row">${btn('秘密を閉じて次へ','role-next','','primary')}</div>`);return}if(g.task){renderTask();return}const living=alive();let content=`<div class="card"><div class="phase">DAY ${g.day} / ${{night:'夜',morning:'朝',day:'昼の話し合い',vote:'投票',end:'結果'}[g.phase]}</div><h2>${g.phase==='end'?E(g.winner)+'の勝利':g.phase==='night'?'夜が訪れました':g.phase==='morning'?'朝になりました':g.phase==='vote'?'追放する人を選ぼう':'みんなの話を聞いてみよう'}</h2><div class="row"><span class="badge">生存 ${living.length}人</span><span class="badge">開始時シーウルフ ${g.rules.settings.wolves}匹</span>${btn('ゲームを終了する','quit','','danger')}</div></div>`;
if(g.phase==='end'){content+=`<div class="card"><h2>役職と夜の記録</h2><div class="grid">${g.players.map(p=>`<div class="player">${avatar(p.char)}<div><strong>${E(p.display)}</strong><br>${E(role(p).name)} / ${p.alive?'生存':'死亡'}</div></div>`).join('')}</div><details><summary>夜の行動を振り返る</summary>${g.privateLog.map(x=>`<p>${E(x)}</p>`).join('')}</details><div class="row">${btn('振り返りJSONを書き出す','export-result')}${btn('もう一度遊ぶ','restart','','primary')}</div></div>`;}else if(g.phase==='night'){content+=`<div class="card"><p>各プレイヤーの役職・能力を順番に確認します。</p>${btn('夜の行動を開始','night-start','','primary')}</div>`;}else if(g.phase==='morning'){content+=`<div class="card"><h3>${g.nightDeaths.length?g.nightDeaths.map(id=>E(name(id))).join('、')+'が死亡しました。':'昨夜、死亡者はいませんでした。'}</h3>${btn('昼の話し合いへ','morning-next','','primary')}</div>`;}else if(g.phase==='day'){content+=`<div class="card"><p>発言 ${g.round+1} / ${g.rules.settings.speeches}巡目。次：${E(g.players[g.queue[g.cursor]]?.display||'発言終了')}</p>${btn('次の発言へ','day-next','','primary')}</div>`;}else if(g.phase==='vote'){content+=`<div class="card"><p>全員の投票が終わるまで票は公開されません。同票は追放なしです。</p>${btn('投票を始める','vote-start','','primary')}</div>`;}

function beginNight(){g.phase='night';g.actions={};g.task=null;reveal=false;}
function nightStart(){g.queue=alive().map(p=>p.id);g.cursor=0;nextNight();}
function targets(p,type){const s=g.rules.settings;return alive().filter(t=>{if(type==='guard')return(s.selfGuard||t.id!==p.id)&&(s.repeatGuard||t.id!==p.previousGuard);if(type==='attack')return t.id!==p.id&&(role(p).team!=='wolf'||p.role==='boss'||role(t).team!=='wolf');if(['divine','revenge'].includes(type))return t.id!==p.id;return false});}
function setAction(p,target){const r=role(p);g.actions[p.id]={actor:p.id,target,ability:r.ability,priority:r.priority};if(r.ability==='revenge')p.revengeTarget=target;g.privateLog.push(`${g.day}日目夜 ${p.display}：${r.name}${target===null?'（対象なし）':' → '+name(target)}`);}
function nextNight(){while(g.cursor<g.queue.length){const p=who(g.queue[g.cursor]),r=role(p);if(p.human){g.task={type:'night',actor:p.id};reveal=false;render();return}setAction(p,cpuNight(p));g.cursor++;}resolveNight();render();}
function cpuNight(p){const r=role(p),ts=targets(p,r.ability);if(!ts.length)return null;const v=perspective(p),scores=cpuScores(v);if(r.ability==='attack'){if(v.team==='village')return ts.sort((a,b)=>scores[b.id]-scores[a.id])[0].id;const peers=ts.filter(t=>v.allies.includes(t.id)),outs=ts.filter(t=>!v.allies.includes(t.id));if(p.role==='boss'&&peers.length&&v.allies.filter(id=>v.players.find(t=>t.id===id)?.alive).length>=2){const danger=publicSuspicion(p.id),most=peers.sort((a,b)=>publicSuspicion(b.id)-publicSuspicion(a.id))[0];const wolves=v.allies.filter(id=>v.players.find(t=>t.id===id)?.alive).length+1;const villagers=v.players.filter(t=>t.alive&&!v.allies.includes(t.id)&&t.id!==p.id).length;if(villagers>wolves+1&&danger>1&&publicSuspicion(most.id)>2&&Math.random()<.35)return most.id;}return outs.length?outs.sort((a,b)=>(v.claims[b.id]||0)-(v.claims[a.id]||0)||publicSuspicion(a.id)-publicSuspicion(b.id))[0].id:null;}
if(r.ability==='guard')return ts.sort((a,b)=>scores[a.id]-scores[b.id]||(v.claims[b.id]||0)-(v.claims[a.id]||0))[0].id;if(r.ability==='divine')return ts.filter(t=>v.known[t.id]===undefined).sort((a,b)=>scores[b.id]-scores[a.id])[0]?.id??rand(ts).id;return ts.sort((a,b)=>scores[b.id]-scores[a.id])[0].id;}
function killCascade(initial,attacks,protectedIds){const dead=new Set(initial),todo=[...initial];for(let i=0;i<todo.length;i++){const p=who(todo[i]);if(!p)continue;const r=role(p);if(r.ability==='revenge'){const t=p.revengeTarget;if(t!==null&&t!==undefined&&who(t)?.alive&&!dead.has(t)&&!protectedIds.has(t)){dead.add(t);todo.push(t);g.privateLog.push(`${g.day}日目 ${p.display}の道連れ → ${name(t)}`);}}}return dead;}
function resolveNight(){const acts=Object.values(g.actions).sort((a,b)=>a.priority-b.priority),protectedIds=new Set(),dead=new Set();const infos=a=>{const p=who(a.actor),r=role(p);if(dead.has(p.id)&&!r.afterDeath)return;if(a.ability==='divine'&&a.target!==null){p.known[a.target]=role(who(a.target)).team;g.privateLog.push(`${g.day}日目 ${p.display}の占い結果：${name(a.target)}=${p.known[a.target]}`);}if(a.ability==='info'&&g.lastExile!==null){p.known[g.lastExile]=role(who(g.lastExile)).team;g.privateLog.push(`${g.day}日目 ${p.display}の情報：${name(g.lastExile)}=${p.known[g.lastExile]}`);}};
for(const a of acts.filter(a=>['divine','info'].includes(a.ability)&&a.priority<20))infos(a);
for(const a of acts){if(a.ability==='guard'&&a.target!==null){protectedIds.add(a.target);who(a.actor).previousGuard=a.target;}if(a.ability==='defend')protectedIds.add(a.actor);}
// One shared wolf attack per night. A boss's explicit sibling attack takes precedence.
const attacks=acts.filter(a=>a.ability==='attack'&&a.target!==null),bossAttack=attacks.find(a=>who(a.actor).role==='boss'&&role(who(a.target)).team==='wolf');let chosen=bossAttack;
if(!chosen&&attacks.length){const counts={};attacks.forEach(a=>counts[a.target]=(counts[a.target]||0)+1);const max=Math.max(...Object.values(counts)),id=+rand(Object.keys(counts).filter(k=>counts[k]===max));chosen=rand(attacks.filter(a=>a.target===id));}
if(chosen){g.privateLog.push(`${g.day}日目 襲撃実行者：${name(chosen.actor)} → ${name(chosen.target)}`);if(!protectedIds.has(chosen.target)){const victim=who(chosen.target),r=role(victim);if(r.ability==='counter'&&r.timing==='before'){if(!protectedIds.has(chosen.actor))dead.add(chosen.actor);}else{dead.add(victim.id);if(r.ability==='counter'&&!protectedIds.has(chosen.actor))dead.add(chosen.actor);}}else g.privateLog.push(`${g.day}日目 ${name(chosen.target)}は護衛・防御により生存。`);}
for(const id of killCascade(dead,attacks,protectedIds))dead.add(id);
for(const a of acts.filter(a=>['divine','info'].includes(a.ability)&&a.priority>=20))infos(a);
for(const id of dead)who(id).alive=false;g.nightDeaths=[...dead];log('morning',dead.size?[...dead].map(name).join('、')+'が死亡しました。':'昨夜の死亡者はいませんでした。',{deaths:[...dead]});g.task=null;g.phase='morning';checkWinner();}
function checkWinner(){const a=alive(),w=a.filter(p=>role(p).team==='wolf').length,v=a.length-w,s=g.rules.settings;let winner=null;if(a.length===0)winner='引き分け';else if(w===0)winner=s.villageWin==='survivors'&&v<s.requiredSurvivors?'引き分け':'村人陣営';else if(s.wolfWin==='parity'&&w>=v||s.wolfWin==='eliminate'&&v===0)winner='シーウルフ陣営';if(winner){g.winner=winner;g.phase='end';g.task=null;log('end',winner==='引き分け'?'勝利条件を満たす陣営がなく、引き分け。':winner+'の勝利！');return true}return false;}
// The inference engine receives a deliberately limited view, never the role table.
function perspective(p){return{self:p.id,team:role(p).team,ownAbility:role(p).ability,boss:p.role==='boss',allies:role(p).team==='wolf'?g.players.filter(x=>x.id!==p.id&&role(x).team==='wolf').map(x=>x.id):[],bossAlly:role(p).team==='wolf'?g.players.find(x=>x.role==='boss')?.id:null,players:g.players.map(x=>({id:x.id,alive:x.alive,display:x.display})),known:copy(p.known),log:copy(g.log),day:g.day,level:g.rules.settings.level,profile:copy(p.char),previousScores:copy(p.previousScores),claims:Object.fromEntries(g.log.filter(l=>l.type==='speech'&&l.claim).map(l=>[l.actor,1]))};}
function cpuScores(v){const scores=Object.fromEntries(v.players.map(p=>[p.id,0]));const weight=v.level==='hard'?1.4:v.level==='easy'?.25:1;
for(const l of v.log){if(l.type==='speech'&&l.target!==null&&l.target!==undefined){if(l.kind==='suspect')scores[l.target]+=.35*weight;if(l.kind==='trust')scores[l.target]-=.25*weight;if(l.kind==='divine'){const actorKnown=v.known[l.actor];const credibility=actorKnown==='wolf'?-.4:actorKnown==='village'?1.5:.8;scores[l.target]+=(l.result==='wolf'?2:-1.5)*credibility*weight;}}if(l.type==='answer'&&typeof l.answer==='number'){const positive=[1,6,8].includes(l.kind);scores[l.answer]+=(positive?-.18:.25)*weight;}if(l.type==='votes'){for(const x of l.votes){if(v.known[x.target]==='wolf')scores[x.actor]-=.6*weight;if(v.known[x.target]==='village')scores[x.actor]+=.3*weight;}}}
if(v.level==='hard'){const div=v.log.filter(l=>l.type==='speech'&&l.kind==='divine');for(const l of div){if(div.some(k=>k.actor===l.actor&&k.target===l.target&&k.result!==l.result))scores[l.actor]+=3;}
const morning=v.log.filter(l=>l.type==='morning').at(-1);for(const id of morning?.deaths||[]){for(const l of v.log.filter(x=>x.type==='speech'&&x.target===id&&x.kind==='suspect'))scores[l.actor]+=.35;}}
for(const p of v.players){if(v.known[p.id]!==undefined)scores[p.id]=v.known[p.id]==='wolf'?20:-20;if(v.team==='wolf'&&v.allies.includes(p.id))scores[p.id]-=4;}
scores[v.self]=-100;return scores;}
function publicSuspicion(id){return g.log.reduce((n,l)=>n+(l.type==='speech'&&l.target===id&&l.kind==='suspect'?1:0)+(l.type==='answer'&&l.answer===id&&![1,6,8].includes(l.kind)?.5:0)+(l.type==='votes'?l.votes.filter(v=>v.target===id).length*.5:0),0);}
function cpuPick(v,kind=0){const s=cpuScores(v),ts=v.players.filter(p=>p.alive&&p.id!==v.self);if(!ts.length)return 'none';if([2,7,8].includes(kind)&&v.day<2)return 'unknown';if(kind===3&&!v.log.some(l=>l.type==='morning'&&l.deaths.length))return 'none';if(kind===10){const claim=ts.filter(t=>v.claims[t.id]);return claim.length?rand(claim).id:'unknown';}if(kind===9){const div=v.log.filter(l=>l.type==='speech'&&l.kind==='divine'),bad=ts.find(t=>div.some(l=>l.actor===t.id&&div.some(k=>k.actor===t.id&&k.target===l.target&&k.result!==l.result)));return bad?.id??'none';}
if(kind===2){const last=v.log.filter(l=>l.type==='votes').at(-1);if(!last)return 'unknown';for(const x of last.votes)if(v.known[x.target]==='village')s[x.actor]+=2;else if(v.known[x.target]==='wolf')s[x.actor]-=2;else if(x.target===v.self)s[x.actor]+=.5;}if(kind===3){const deaths=v.log.filter(l=>l.type==='morning').at(-1)?.deaths||[];for(const l of v.log.filter(l=>l.type==='speech'&&deaths.includes(l.target)))s[l.actor]+=l.kind==='suspect'?.7:-.3;}const positive=[1,6,8].includes(kind);if([7,8].includes(kind)){for(const t of ts)s[t.id]-=v.previousScores[t.id]||0;}ts.sort((a,b)=>positive?s[a.id]-s[b.id]:s[b.id]-s[a.id]);const top=ts[0];const decisive=Math.abs(s[top.id])>2;if(v.level==='easy'&&Math.random()<.4)return rand([...ts.map(t=>t.id),'unknown','none']);if(!decisive&&v.profile.personality==='careful')return 'unknown';if(!decisive&&v.profile.personality==='calm'&&kind!==5)return 'none';if(!decisive&&v.day===1&&Math.random()<.25)return 'unknown';return top.id;}
function cpuVote(p){const v=perspective(p),ts=v.players.filter(t=>t.alive&&t.id!==p.id),s=cpuScores(v);if(v.team==='wolf'&&v.bossAlly!==undefined&&v.bossAlly!==p.id&&publicSuspicion(p.id)>2&&Math.random()<.3)s[v.bossAlly]+=8;const jitter=v.level==='easy'?5:v.level==='normal'?1:.2;return ts.sort((a,b)=>(s[b.id]+Math.random()*jitter)-(s[a.id]+Math.random()*jitter))[0].id;}
function cpuSpeech(p){const v=perspective(p),known=Object.entries(v.known).filter(([id])=>v.players.find(x=>x.id===+id)?.alive);let kind='suspect',target=cpuPick(v,0),result=null,claim=false;if(v.ownAbility==='divine'&&known.length&&(known.some(x=>x[1]==='wolf')||v.day>1||publicSuspicion(p.id)>1)){const entry=known.find(x=>x[1]==='wolf')||known.at(-1);kind='divine';target=+entry[0];result=entry[1];claim=true;}else if(v.team==='wolf'&&v.level!=='easy'&&publicSuspicion(p.id)>2&&Math.random()<.35){kind='divine';target=cpuPick(v,0);if(typeof target!=='number')target=rand(v.players.filter(x=>x.alive&&!v.allies.includes(x.id)&&x.id!==p.id)).id;result='wolf';claim=true;}else if(typeof target!=='number'){kind=target==='none'?'none':'unknown';target=null;}else if(v.profile.personality==='calm'&&Math.random()<.35){target=cpuPick(v,1);kind='trust';if(typeof target!=='number'){kind='unknown';target=null;}}
let text=kind==='divine'?`${v.profile.firstPerson||'私'}は占い師。${name(target)}は${result==='wolf'?'シーウルフ':'村人'}陣営だった。`:kind==='suspect'?`${name(target)}が気になる。${speechReason(v,target)}`:kind==='trust'?`${name(target)}は信用できそう。` :kind==='none'?'今のところ、強く疑う人はいない。':'まだ情報が足りない。もう少し話を聞きたい。';if(v.profile.personality==='careful')text='断言はできないけれど、'+text;if(v.profile.personality==='bold')text+=' はっきり決めていこう！';if(v.profile.age==='child')text=text.replace('情報が足りない','よくわからない').replace('断言はできないけれど','まだ決められないけど');if(v.profile.age==='senior')text=text.replace('気になる','気になるのう');text+=v.profile.suffix||'';log('speech',p.display+'：'+text,{actor:p.id,kind,target,result,claim});}
function speechReason(v,id){if(v.known[id]==='wolf')return'自分が得た情報からそう考えている。';if(v.log.some(l=>l.type==='votes'&&l.votes.some(x=>x.actor===id)))return'これまでの投票や発言を見て考えた。';if(v.log.some(l=>l.type==='answer'&&l.actor===id))return'質問への回答も気になった。';return'まだ確信はないけれど、反応を聞いてみたい。';}
function beginDay(){g.phase='day';g.round=0;g.queue=shuffle(alive().map(p=>p.id));g.cursor=0;g.task=null;}
function nextDay(){if(g.cursor>=g.queue.length){g.round++;if(g.round>=g.rules.settings.speeches){g.phase='vote';g.task=null;render();return}g.cursor=0;}const p=who(g.queue[g.cursor]);if(!p.alive){g.cursor++;nextDay();return}if(p.human){g.task={type:'speech',actor:p.id};reveal=false;render();return}cpuSpeech(p);g.cursor++;if(cpuWantsQuestion(p)){beginQuestion(p,cpuQuestion(p));}else render();}
function cpuWantsQuestion(p){if(!g.rules.settings.questions||p.questionUsed)return false;const v=perspective(p),chance=(g.day>1?.22:.08)+(g.round===g.rules.settings.speeches-1?.1:0)+(publicSuspicion(p.id)>1?.2:0)+(alive().length<5?.15:0);return Math.random()<chance*(p.char.personality==='careful'?.8:p.char.personality==='bold'?1.3:1);}
function cpuQuestion(p){const q=g.rules.questions.filter(x=>x.enabled);let kinds=publicSuspicion(p.id)>1?[1,5]:g.day>1?[2,7,9]:[0,1,10];return rand(q.filter(x=>kinds.includes(x.kind)).length?q.filter(x=>kinds.includes(x.kind)):q);}
function beginQuestion(p,q){if(!p.alive||p.questionUsed||!g.rules.settings.questions)return;p.questionUsed=true;g.question={asker:p.id,q:copy(q),queue:alive().filter(x=>g.rules.settings.includeAsker||x.id!==p.id).map(x=>x.id),cursor:0,answers:[]};log('question',p.display+'の全体質問：'+q.text,{actor:p.id,qid:q.id});g.task=null;reveal=false;nextAnswer();}
function nextAnswer(){const q=g.question;while(q.cursor<q.queue.length){const p=who(q.queue[q.cursor]);if(p.human){g.task={type:'answer',actor:p.id};reveal=false;render();return}q.answers.push({actor:p.id,answer:cpuPick(perspective(p),q.q.kind)});q.cursor++;}
for(const a of q.answers)log('answer',name(a.actor)+' → '+(a.answer==='none'?'該当なし':a.answer==='unknown'?'わからない':name(a.answer)),{...a,kind:q.q.kind,qid:q.q.id});g.task={type:'question-result'};render();}
function beginVote(){g.voteQueue=alive().map(p=>p.id);g.voteCursor=0;g.pendingVotes=[];nextVote();}
function nextVote(){while(g.voteCursor<g.voteQueue.length){const p=who(g.voteQueue[g.voteCursor]);if(p.human){g.task={type:'vote',actor:p.id};reveal=false;render();return}g.pendingVotes.push({actor:p.id,target:cpuVote(p)});g.voteCursor++;}finishVote();render();}
function finishVote(){const votes=g.pendingVotes;log('votes','投票：'+votes.map(x=>name(x.actor)+' → '+name(x.target)).join(' / '),{votes:copy(votes)});const counts={};votes.forEach(v=>counts[v.target]=(counts[v.target]||0)+1);const max=Math.max(...Object.values(counts)),top=Object.keys(counts).filter(id=>counts[id]===max);g.lastExile=top.length===1?+top[0]:null;if(g.lastExile!==null){const dead=killCascade([g.lastExile],[],new Set());for(const id of dead)who(id).alive=false;log('exile',name(g.lastExile)+'が追放されました。'+([...dead].filter(id=>id!==g.lastExile).length?' 道連れ：'+[...dead].filter(id=>id!==g.lastExile).map(name).join('、'):''),{target:g.lastExile});}else log('exile','最多票が同票のため、追放者なし。');g.task=null;if(!checkWinner()){for(const p of alive())p.previousScores=cpuScores(perspective(p));g.day++;beginNight();}}

function renderHelp(){const c=g?.rules||cfg;$('#app').innerHTML=`<div class="card"><h2>遊び方</h2>${rulesSummary(c)}<p>役職確認 → 夜の能力 → 朝の死亡者公開 → 昼の発言・全体質問 → 投票を繰り返します。死亡した人は観戦できますが、発言・回答・能力・投票はできません。</p><p>質問は発言と別で、各自1ゲームに1回。回答は「生存者」「該当なし」「わからない」から選び、全員の回答後にまとめて公開します。</p><p>夜のシーウルフ襲撃は陣営で1件。各シーウルフが希望を選び、最多の対象へ襲撃します。同票は抽選。ボスが仲間を選んだ場合はその襲撃を優先します。</p><p>ボスはシーウルフ陣営が3匹以上のとき${c.settings.bossRate}%で通常の1匹から変化します。仲間への襲撃に回数制限はありません。</p><p>護衛・防御 → 襲撃 → 反撃・道連れ → 死亡判定 → 情報取得の順です。占い・情報は設定の優先度に従い、死亡後取得ONの場合だけ死亡しても結果を得ます。</p><p>CPUは公開発言・質問回答・投票などと、自分が得た情報だけで推理します。自由入力の文章の意味解析は行わず、選択された発言内容を推理に使います。</p><div class="notice">受け渡し画面は周囲への見え防止用です。同じ端末の操作やHTMLの解析による秘密閲覧まで防ぐ仕組みではありません。</div></div><div class="card"><h2>役職カード</h2><div class="grid">${c.roles.filter(r=>r.enabled).map(r=>`<div class="card">${image(r.image,'role-image')}<h3>${E(r.name)}</h3><span class="badge">${r.team==='wolf'?'シーウルフ':'村人'}陣営</span><p>${E(r.description)}</p>${r.ability==='guard'?`<p>自己護衛${c.settings.selfGuard?'可':'不可'}、連続護衛${c.settings.repeatGuard?'可':'不可'}</p>`:''}</div>`).join('')}</div></div>`;}

function download(data,filename,mime='application/octet-stream'){const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportHTML(pub){validate(cfg);const doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded').textContent=JSON.stringify(cfg).replace(/</g,'\\u003c');doc.querySelector('#nav').innerHTML='';doc.querySelector('#app').innerHTML='';doc.querySelectorAll('.toast').forEach(x=>x.remove());const script=doc.querySelectorAll('script')[1];script.textContent=script.textContent.replace(/const PUBLIC=(true|false);/,`const PUBLIC=${pub};`);download('<!doctype html>\n'+doc.outerHTML,pub?'index.html':'MARINE_SEAWOLF_sw-k9r4v7m2-admin.html','text/html');}
async function loadImage(file){if(!file.type.startsWith('image/'))throw Error('画像ファイルを選んでください。');if(file.size>20*1024*1024)throw Error('画像は20MB以下にしてください。');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*ratio));c.height=Math.max(1,Math.round(bitmap.height*ratio));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();return c.toDataURL('image/webp',.88);}
function imageExtension(s){return s.startsWith('data:image/png')?'png':s.startsWith('data:image/jpeg')?'jpg':'webp';}
function dataBytes(s){const a=s.split(',');return Uint8Array.from(atob(a[1]),c=>c.charCodeAt(0));}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0;}
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(const f of files){const n=enc.encode(f.name),b=f.bytes,crc=crc32(b);const h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,b);const ch=new Uint8Array(46+n.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint32(16,crc,true);cv.setUint32(20,b.length,true);cv.setUint32(24,b.length,true);cv.setUint16(28,n.length,true);cv.setUint32(42,offset,true);ch.set(n,46);central.push(ch);offset+=h.length+b.length;}const size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'});}

async function action(a,v){switch(a){case'home':reveal=false;view='home';break;case'help':reveal=false;view='help';break;case'admin':if(!PUBLIC){reveal=false;view='admin';}break;case'admin-tab':adminTab=v;break;case'shuffle':setupSelection=shuffle(cfg.characters.filter(c=>c.enabled).map(c=>c.id)).slice(0,cfg.settings.n);break;case'start':start();return;case'reveal':reveal=true;break;case'role-next':reveal=false;g.cursor++;if(g.cursor>=humans().length)beginNight();break;case'night-start':nightStart();return;case'night-select':{const p=who(g.task.actor),ts=targets(p,role(p).ability),target=v==='none'?null:+v;if(target!==null&&!ts.some(x=>x.id===target))throw Error('選択できない対象です。');setAction(p,target);g.task=null;reveal=false;g.cursor++;nextNight();return;}case'morning-next':beginDay();break;case'day-next':nextDay();return;case'speech-submit':{const p=who(g.task.actor),kind=$('#speech-kind').value,target=['unknown','none','claim'].includes(kind)?null:+$('#speech-target').value,result=kind==='divine'?$('#speech-result').value:null,extra=$('#speech-text').value.trim();const text=kind==='suspect'?name(target)+'が怪しいと思う。':kind==='trust'?name(target)+'を信用している。':kind==='divine'?'占い師です。'+name(target)+'は'+(result==='wolf'?'シーウルフ':'村人')+'陣営。':kind==='claim'?'役職を持っています。':kind==='none'?'強く疑う人はいない。':'まだわからない。';log('speech',p.display+'：'+text+(extra?' '+extra:''),{actor:p.id,kind,target,result,claim:['divine','claim'].includes(kind)});g.cursor++;g.task=null;reveal=false;break;}case'question-pick':g.task.type='question-pick';break;case'question-back':g.task.type='speech';break;case'question-start':{const p=who(g.task.actor),q=g.rules.questions.find(q=>q.id===v&&q.enabled);if(!q)throw Error('質問がありません。');beginQuestion(p,q);return;}case'answer-select':{const p=who(g.task.actor);if(!['none','unknown'].includes(v)&&!alive().some(t=>t.id===+v))throw Error('回答対象がいません。');g.question.answers.push({actor:p.id,answer:['none','unknown'].includes(v)?v:+v});g.question.cursor++;g.task=null;reveal=false;nextAnswer();return;}case'question-done':{const asker=who(g.question.asker);g.task=asker.human?{type:'speech',actor:asker.id}:null;reveal=false;g.question=null;break;}case'vote-start':beginVote();return;case'vote-select':{const p=who(g.task.actor),id=+v;if(!alive().some(t=>t.id===id&&id!==p.id))throw Error('投票対象を確認してください。');g.pendingVotes.push({actor:p.id,target:id});g.voteCursor++;g.task=null;reveal=false;nextVote();return;}case'quit':confirmUI('ゲームを終了しますか？','現在のゲームを終了し、参加設定へ戻ります。',()=>{g=null;view='home';});return;case'restart':g=null;view='home';break;case'export-result':download(JSON.stringify(g,null,2),'SEA_WOLF_result.json','application/json');break;case'save':validate(cfg);try{localStorage.setItem('sea-wolf-config-v1',JSON.stringify(cfg));toast('設定を保存しました。');}catch{throw Error('端末の保存容量を超えました。JSONかMASTER HTMLを書き出して保存してください。');}break;case'export-master':exportHTML(false);break;case'export-index':exportHTML(true);break;case'export-json':download(JSON.stringify(cfg,null,2),'SEA_WOLF_settings.json','application/json');break;case'add-char':cfg.characters.push({id:'c'+Date.now(),name:'新しいキャラクター',image:'',personality:'calm',age:'adult',gender:'other',firstPerson:'私',suffix:'',enabled:true});break;case'add-role':cfg.roles.push({...copy(cfg.roles[0]),id:'r'+Date.now(),name:'新しい役職',category:'special',min:0,max:1});break;case'add-question':cfg.questions.push({id:'q'+Date.now(),text:'新しい質問',kind:0,enabled:true});break;case'image-remove':{const [k,id]=v.split(':');cfg[k].find(x=>x.id===id).image='';break;}case'remove':{const[k,id]=v.split(':');confirmUI('項目を削除しますか？','削除前の設定を残す場合はJSONを書き出してください。',()=>{cfg[k]=cfg[k].filter(x=>x.id!==id);});return;}case'move':{const[k,idx,delta]=v.split(':'),i=+idx,j=i+(+delta);if(j>=0&&j<cfg[k].length)[cfg[k][i],cfg[k][j]]=[cfg[k][j],cfg[k][i]];break;}case'card-export':{const r=cfg.roles.find(r=>r.id===v);if(!r.image)throw Error('カード画像を登録してください。');download(new Blob([dataBytes(r.image)]),r.name+'.'+imageExtension(r.image));break;}case'cards-export':{const files=cfg.roles.filter(r=>r.image).map(r=>({name:r.id+'.'+imageExtension(r.image),bytes:dataBytes(r.image)}));if(!files.length)throw Error('カード画像を登録してください。');files.push({name:'roles.json',bytes:new TextEncoder().encode(JSON.stringify(cfg.roles.map(({image,...r})=>r),null,2))});download(zip(files),'SEA_WOLF_role_cards.zip');break;}case'modal-cancel':modal=null;break;case'modal-confirm':{const fn=modal.fn;modal=null;fn();break;}}
render();}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;b.disabled=true;try{await action(b.dataset.action,b.dataset.value);}catch(err){toast(err.message);b.disabled=false;}});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='import-json'){const parsed=JSON.parse(await el.files[0].text());if(!parsed.settings||!Array.isArray(parsed.characters)||!Array.isArray(parsed.roles)||!Array.isArray(parsed.questions))throw Error('SEA WOLF設定JSONを選んでください。');validate(parsed);if(['characters','roles','questions'].some(k=>new Set(parsed[k].map(x=>x.id)).size!==parsed[k].length))throw Error('IDが重複しています。');cfg=parsed;setupSelection=[];render();toast('JSONを読み込みました。保存ボタンで保持できます。');return}if(el.dataset.image){const item=cfg[el.dataset.image].find(x=>x.id===el.dataset.id);item.image=await loadImage(el.files[0]);render();return}if(el.dataset.slot!==undefined){setupSelection[+el.dataset.slot]=el.value;return}if(el.dataset.scope){const k=el.dataset.key,scope=el.dataset.scope,object=scope==='settings'||scope==='setup'?cfg.settings:cfg[scope].find(x=>x.id===el.dataset.id);let value=el.type==='checkbox'?el.checked:el.type==='number'||k==='kind'?Number(el.value):el.value;if(k==='id'&&(String(value).includes(':')||!String(value).trim()||cfg[scope].some(x=>x!==object&&x.id===value)))throw Error('IDは空・重複・コロン使用を避けてください。');object[k]=value;if(scope==='roles'&&k==='ability'){object.priority=['guard','defend'].includes(value)?10:value==='attack'?20:['counter','revenge'].includes(value)?30:50;render();}if(scope==='setup'){cfg.settings.n=Math.max(4,Math.min(24,Math.floor(cfg.settings.n)||4));cfg.settings.cpu=Math.max(0,Math.min(cfg.settings.n-1,Math.floor(cfg.settings.cpu)||0));render();}else if(k==='id')render();}}catch(err){toast(err.message);}});
window.addEventListener('pagehide',()=>{reveal=false;});window.addEventListener('pageshow',()=>{reveal=false;render();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&reveal){reveal=false;render();}});
render();
</script></body></html>
